<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">

<title>Maceon Play</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #080808;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
}

.container {
    width: 100%;
    max-width: 1000px;
    padding: 24px;
    text-align: center;
}

.logo {
    font-size: clamp(32px, 8vw, 64px);
    font-weight: 900;
    letter-spacing: 3px;
    margin: 30px 0 8px;
}

.play {
    color: #55d6be;
}

.subtitle {
    color: #bbbbbb;
    margin-bottom: 30px;
}

.start {
    min-height: 420px;
    background: #000000;
    border-radius: 18px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    padding: 25px;
}

.start h2 {
    margin: 0 0 12px;
}

.start p {
    color: #bbbbbb;
    max-width: 500px;
}

input[type="file"] {
    display: none;
}

.button {
    display: inline-block;
    margin-top: 18px;
    padding: 16px 28px;

    border-radius: 12px;

    background: #55d6be;
    color: #07110f;

    font-weight: bold;
    font-size: 17px;

    cursor: pointer;
}


/* =========================================
   ÁREA DO EMULADOR
   Altura fixa evita o loop de redimensionamento
   ========================================= */

#game {
    width: 100%;
    height: 600px;
    max-height: 70vh;

    position: relative;
    overflow: hidden;

    background: #000000;
}


/*
   Depois que o EmulatorJS inicia,
   #game recebe a classe ejs_parent.
*/

#game.ejs_parent {
    width: 100% !important;
    height: 600px !important;
    max-height: 70vh !important;

    position: relative !important;
    overflow: hidden !important;
}


/*
   Contêiner criado pelo EmulatorJS.
*/

#game .ejs_canvas_parent {
    position: absolute !important;

    top: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    left: 0 !important;

    width: 100% !important;
    height: 100% !important;

    overflow: hidden !important;
}


/*
   Canvas onde o jogo é desenhado.
*/

#game canvas.ejs_canvas {
    width: 100% !important;
    height: 100% !important;

    max-width: 100% !important;
    max-height: 100% !important;

    display: block !important;

    object-fit: contain !important;
}


@media (max-width: 600px) {

    .container {
        padding: 10px;
    }

    .start {
        min-height: 65vh;
    }

    #game,
    #game.ejs_parent {
        height: 70vh !important;
        max-height: 70vh !important;
    }
}

</style>
</head>


<body>

<main class="container">

    <div id="header">

        <div class="logo">
            MACEON <span class="play">PLAY</span>
        </div>

        <div class="subtitle">
            Toque. Abra. Jogue.
        </div>

    </div>


    <div id="launcher" class="start">

        <h2>Game Boy Advance</h2>

        <p>
            Selecione no seu aparelho um jogo GBA que você possua.
            O arquivo será carregado localmente no navegador.
        </p>

        <label class="button" for="romFile">
            SELECIONAR JOGO
        </label>

        <input
            id="romFile"
            type="file"
            accept=".gba,.zip"
        >

    </div>


    <div id="game"></div>

</main>


<script>

const romInput = document.getElementById("romFile");
const launcher = document.getElementById("launcher");

romInput.addEventListener("change", function(event) {

    const file = event.target.files[0];

    if (!file) {
        return;
    }

    /*
       Cria uma URL temporária local.
       O arquivo não é enviado para o GitHub.
    */

    const gameURL = URL.createObjectURL(file);

    const gameName =
        file.name.replace(/\.[^/.]+$/, "");


    /*
       Esconde a tela de seleção.
    */

    launcher.style.display = "none";


    /*
       CONFIGURAÇÃO DO EMULATORJS
    */

    window.EJS_player = "#game";

    window.EJS_gameName = gameName;

    window.EJS_gameID = "maceon-play-gba";

    window.EJS_gameUrl = gameURL;

    window.EJS_core = "gba";

    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/stable/data/";

    window.EJS_startOnLoaded = true;

    window.EJS_language = "pt-BR";


    /*
       Carrega o EmulatorJS.
    */

    const loader =
        document.createElement("script");

    loader.src =
        "https://cdn.emulatorjs.org/stable/data/loader.js";


    loader.onerror = function() {

        launcher.style.display = "flex";

        alert(
            "Não foi possível carregar o emulador. Verifique sua conexão e tente novamente."
        );
    };


    document.body.appendChild(loader);

});

</script>

</body>

</html>
