
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diagnóstico SNES — Maceon Play</title>
  <style>
    body {
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
    main { max-width: 850px; margin: auto; }
    button {
      padding: 14px 28px;
      margin: 12px;
      cursor: pointer;
    }
    #game { width: 100%; height: 600px; max-height: 70vh; }
    pre {
      text-align: left;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #242424;
      padding: 16px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Diagnóstico do emulador SNES</h1>
    <button id="play">JOGAR</button>
    <button id="check" disabled>VERIFICAR SALVAMENTO</button>
    <p id="status">Pronto para iniciar.</p>
    <pre id="result">O resultado aparecerá aqui.</pre>
    <div id="game"></div>
  </main>

  <script>
    const play = document.getElementById("play");
    const check = document.getElementById("check");
    const status = document.getElementById("status");
    const result = document.getElementById("result");

    play.addEventListener("click", () => {
      play.disabled = true;
      status.textContent = "Carregando emulador...";

      window.EJS_player = "#game";
      window.EJS_gameName = "Diagnostico SNES";
      window.EJS_gameUrl = "./games/super-encanador.sfc";
      window.EJS_core = "snes";
      window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/stable/data/";
      window.EJS_startOnLoaded = true;

      window.EJS_onGameStart = () => {
        status.textContent = "Jogo iniciado. Clique em VERIFICAR SALVAMENTO.";
        check.disabled = false;
      };

      const script = document.createElement("script");
      script.src =
        "https://cdn.emulatorjs.org/stable/data/loader.js";
      script.onerror = () => {
        status.textContent = "Não foi possível carregar o emulador.";
        play.disabled = false;
      };
      document.body.appendChild(script);
    });

    check.addEventListener("click", () => {
      const emulator = window.EJS_emulator;
      const gm = emulator?.gameManager;

      const functions = [
        "saveState",
        "loadState",
        "getState",
        "setState",
        "getSaveFile",
        "getSaveFilePath",
        "loadSaveFiles"
      ];

      result.textContent = [
        "Emulador disponível: " + Boolean(emulator),
        "GameManager disponível: " + Boolean(gm),
        "",
        ...functions.map(name =>
          name + ": " + typeof gm?.[name]
        )
      ].join("\n");
    });
  </script>
</body>
</html>
