
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Super Encanador | Maceon Play</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px 48px;
      background: #101010;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header { margin-bottom: 30px; }

    h1 {
      margin-bottom: 8px;
      font-size: clamp(28px, 5vw, 42px);
    }

    .subtitulo { color: #c9c9c9; }

    .catalogo {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 340px));
      justify-content: center;
      gap: 24px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .jogo {
      padding: 16px;
      background: #1c1c1c;
      border: 1px solid #55d6be;
      border-radius: 20px;
    }

    .capa {
      display: block;
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      border-radius: 14px;
    }

    .jogo h2 {
      margin: 18px 0 8px;
      font-size: 24px;
    }

    .detalhes {
      margin-bottom: 18px;
      color: #c9c9c9;
    }

    .jogar {
      display: block;
      padding: 16px;
      background: #55d6be;
      color: #101010;
      border-radius: 12px;
      font-size: 20px;
      font-weight: bold;
      text-decoration: none;
    }

    .jogar:hover { background: #78e5d1; }

    footer {
      margin-top: 36px;
      color: #aaa;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <h1>MACEON PLAY</h1>
    <p class="subtitulo">Catálogo Super Encanador</p>
  </header>

  <main class="catalogo">
    <article class="jogo">
      <img
        class="capa"
        src="games/super-encanador-catalogo.jpg"
        alt="Capa do Super Encanador — Jogo 01"
      >

      <h2>Super Encanador</h2>
      <p class="detalhes">Jogo 01 • Super Nintendo</p>

      <a class="jogar" href="jogo-01.html">JOGAR</a>
    </article>
  </main>

  <footer>Novos jogos em breve!</footer>
</body>
</html>
