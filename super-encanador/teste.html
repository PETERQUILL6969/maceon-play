
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Super Encanador — Teste SNES</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    main { max-width: 850px; margin: auto; }
    input, button { margin: 12px; }
    button { padding: 12px 22px; cursor: pointer; }
    #game { width: 100%; height: 600px; max-height: 70vh; }
    #status { color: #ddd; }
  </style>
</head>
<body>
  <main>
    <h1>Super Encanador</h1>
    <p>Teste do emulador SNES com um homebrew autorizado.</p>

    <input id="rom" type="file" accept=".sfc,.smc">
    <button id="play" disabled>JOGAR</button>
    <p id="status">Selecione um arquivo SNES para testar.</p>

    <div id="game"></div>
  </main>

  <script>
    const romInput = document.getElementById("rom");
    const playButton = document.getElementById("play");
    const status = document.getElementById("status");

    let romUrl = null;
    let started = false;

    romInput.addEventListener("change", () => {
      if (romUrl) URL.revokeObjectURL(romUrl);
      const file = romInput.files[0];
      romUrl = file ? URL.createObjectURL(file) : null;
      playButton.disabled = !file || started;
      status.textContent = file
        ? "Arquivo selecionado: " + file.name
        : "Selecione um arquivo SNES para testar.";
    });

    playButton.addEventListener("click", () => {
      if (!romUrl || started) return;

      started = true;
      playButton.disabled = true;
      romInput.disabled = true;
      status.textContent = "Carregando o emulador...";

      window.EJS_player = "#game";
      window.EJS_gameName = "Teste SNES Homebrew";
      window.EJS_gameUrl = romUrl;
      window.EJS_core = "snes";
      window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/stable/data/";
      window.EJS_startOnLoaded = true;

      window.EJS_onGameStart = () => {
        status.textContent = "Jogo iniciado!";
      };

      const script = document.createElement("script");
      script.src =
        "https://cdn.emulatorjs.org/stable/data/loader.js";
      script.onerror = () => {
        status.textContent = "Erro ao carregar o emulador.";
      };
      document.body.appendChild(script);
    });
  </script>
</body>
</html>
