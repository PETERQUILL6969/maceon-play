
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maceon Play — Super Encanador — Jogo 01</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      max-width: 850px;
      margin: auto;
    }

    button {
      padding: 14px 32px;
      border: 0;
      border-radius: 10px;
      background: #55d6be;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #game {
      width: 100%;
      height: 600px;
      max-height: 70vh;
    }

    #status { color: #ddd; }
  </style>
</head>
<body>
  <main>
    <h1>MACEON PLAY</h1>
    <h2>Super Encanador — Jogo 01</h2>

<img
  src="games/super-encanador-jogo.jpg"
  alt="Arte do Super Encanador — Jogo 01"
  style="display:block; width:100%; max-width:360px; height:auto; margin:24px auto; border-radius:12px;"
>

<button id="play">JOGAR</button>
    <p id="status">Pronto para jogar!</p>

    <div id="game"></div>
  </main>

  <script>
    "use strict";

    const play = document.getElementById("play");
    const status = document.getElementById("status");

    let started = false;

    play.addEventListener("click", async () => {
      if (started) return;

      play.disabled = true;
      status.textContent = "Verificando jogo...";

      const gameUrl = "./games/homebrew-autorizado.sfc";

      try {
        const response = await fetch(gameUrl, {
          method: "HEAD"
        });

        if (!response.ok) {
          throw new Error("Arquivo não encontrado.");
        }
      } catch (error) {
        status.textContent = error.message;
        play.disabled = false;
        return;
      }

      started = true;
      status.textContent = "Carregando emulador...";

      window.EJS_player = "#game";
      window.EJS_gameName = "Teste Save Novo";
      window.EJS_gameID = 93003;
      window.EJS_gameUrl = gameUrl;
      window.EJS_core = "snes";

      window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/stable/data/";

      window.EJS_startOnLoaded = true;
      window.EJS_language = "pt-BR";

      window.EJS_defaultOptions = {
        "save-state-location": "browser"
      };

      window.EJS_onGameStart = () => {
        status.textContent = "Jogo iniciado!";
        play.hidden = true;
      };

      const script = document.createElement("script");

      script.src =
        "https://cdn.emulatorjs.org/stable/data/loader.js";

      script.onerror = () => {
        started = false;
        play.disabled = false;
        status.textContent =
          "Não foi possível carregar o emulador.";
      };

      document.body.appendChild(script);
    });
  </script>
</body>
</html>
