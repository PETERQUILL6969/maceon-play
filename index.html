<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#080808">

<title>Maceon Play</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
    background:#080808;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
}

.container{
    width:100%;
    max-width:900px;
    padding:24px;
    text-align:center;
}

.logo{
    font-size:clamp(32px,8vw,64px);
    font-weight:900;
    letter-spacing:3px;
    margin:30px 0 8px;
}

.play{color:#55d6be}

.subtitle{
    color:#bbb;
    margin-bottom:30px;
}

.start{
    min-height:420px;
    background:#000;
    border-radius:18px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:25px;
}

.start h2{
    margin:0 0 12px;
}

.start p{
    color:#bbb;
    max-width:500px;
}

input[type=file]{
    display:none;
}

.button{
    display:inline-block;
    margin-top:18px;
    padding:16px 28px;
    border-radius:12px;
    background:#55d6be;
    color:#07110f;
    font-weight:bold;
    cursor:pointer;
    font-size:17px;
}

#game{
    width:100%;
    min-height:70vh;
}

@media(max-width:600px){
    .container{padding:10px}
    .start{min-height:65vh}
}
</style>
</head>

<body>

<main class="container">

<div id="header">
    <div class="logo">
        MACEON <span class="play">PLAY</span>
    </div>

    <div class="subtitle">
        Toque. Abra. Jogue.
    </div>
</div>

<div id="launcher" class="start">

    <h2>Game Boy Advance</h2>

    <p>
        Selecione no seu aparelho um jogo GBA que você possua.
        O arquivo será carregado localmente no navegador.
    </p>

    <label class="button" for="romFile">
        SELECIONAR JOGO
    </label>

    <input
        id="romFile"
        type="file"
        accept=".gba,.zip"
    >

</div>

<div id="game"></div>

</main>

<script>

document.getElementById("romFile").addEventListener("change", function(event){

    const file = event.target.files[0];

    if(!file) return;

    const gameURL = URL.createObjectURL(file);

    document.getElementById("launcher").style.display = "none";

    window.EJS_player = "#game";
    window.EJS_core = "gba";
    window.EJS_gameUrl = gameURL;
    window.EJS_gameName = file.name.replace(/\.[^/.]+$/, "");

    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/stable/data/";

    window.EJS_startOnLoaded = true;
    window.EJS_language = "pt-BR";

    const loader = document.createElement("script");

    loader.src =
        "https://cdn.emulatorjs.org/stable/data/loader.js";

    document.body.appendChild(loader);

});

</script>

</body>
</html>
