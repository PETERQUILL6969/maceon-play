<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">

<title>Maceon Play</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #080808;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
}

.container {
    width: 100%;
    max-width: 1000px;
    padding: 24px;
    text-align: center;
}

.logo {
    font-size: clamp(32px, 8vw, 64px);
    font-weight: 900;
    letter-spacing: 3px;
    margin: 30px 0 8px;
}

.play {
    color: #55d6be;
}

.subtitle {
    color: #bbbbbb;
    margin-bottom: 30px;
}

.start {
    min-height: 420px;
    background: #000000;
    border-radius: 18px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    padding: 25px;
}

.start h2 {
    margin: 0 0 12px;
}

.start p {
    color: #bbbbbb;
    max-width: 520px;
    line-height: 1.45;
}

.button {
    display: inline-block;
    margin-top: 18px;
    padding: 16px 34px;

    border: 0;
    border-radius: 12px;

    background: #55d6be;
    color: #07110f;

    font-family: inherit;
    font-weight: bold;
    font-size: 18px;

    cursor: pointer;
}

.button:hover {
    filter: brightness(1.08);
}


/* =========================================
   PLAYER — CORREÇÃO FUNCIONAL PRESERVADA
   ========================================= */

#game {
    width: 100%;
    height: 600px;
    max-height: 70vh;

    position: relative;
    overflow: hidden;

    background: #000000;
}

#game.ejs_parent {
    width: 100% !important;
    height: 600px !important;
    max-height: 70vh !important;

    position: relative !important;
    overflow: hidden !important;
}

#game .ejs_canvas_parent {
    position: absolute !important;

    top: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    left: 0 !important;

    width: 100% !important;
    height: 100% !important;

    overflow: hidden !important;
}

#game canvas.ejs_canvas {
    width: 100% !important;
    height: 100% !important;

    max-width: 100% !important;
    max-height: 100% !important;

    display: block !important;
    object-fit: contain !important;
}

@media (max-width: 600px) {

    .container {
        padding: 10px;
    }

    .start {
        min-height: 65vh;
    }

    #game,
    #game.ejs_parent {
        height: 70vh !important;
        max-height: 70vh !important;
    }
}

</style>
</head>

<body>

<main class="container">

    <div id="header">

        <div class="logo">
            MACEON <span class="play">PLAY</span>
        </div>

        <div class="subtitle">
            Toque. Abra. Jogue.
        </div>

    </div>

    <div id="launcher" class="start">

        <h2>Game Boy Advance</h2>

        <p id="message">
            Pronto para jogar.
        </p>

        <button
            id="playButton"
            class="button"
            type="button"
        >
            ▶ JOGAR
        </button>

    </div>

    <div id="game"></div>

</main>

<script>

/* =========================================
   MACEON PLAY
   PLAY DIRETO + SAVE
   ========================================= */

const GAME_URL = "./games/jogo.gba";
const GAME_NAME = "Maceon Play";

/*
   ID NUMÉRICO E FIXO DO JOGO.
   Não alterar posteriormente.
*/
const GAME_ID = 1001;

const launcher =
    document.getElementById("launcher");

const message =
    document.getElementById("message");

const playButton =
    document.getElementById("playButton");

let emulatorStarted = false;


/* =========================================
   INICIAR EMULATORJS
   ========================================= */

function startEmulator() {

    if (emulatorStarted) {
        return;
    }

    emulatorStarted = true;

    playButton.disabled = true;

    message.textContent =
        "Carregando jogo...";

    launcher.style.display =
        "none";


    /* =====================================
       CONFIGURAÇÃO DO EMULATORJS
       ===================================== */

    window.EJS_player =
        "#game";

    window.EJS_gameName =
        GAME_NAME;

    /*
       IMPORTANTE:
       EmulatorJS exige ID numérico.
    */
    window.EJS_gameID =
        GAME_ID;

    window.EJS_gameUrl =
        GAME_URL;

    window.EJS_core =
        "gba";

    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/stable/data/";

    window.EJS_startOnLoaded =
        true;

    /*
       Solicita ao core a sincronização
       periódica do save.
    */
    window.EJS_fixedSaveInterval =
        7000;

    window.EJS_language =
        "pt-BR";


    /*
       CALLBACK OFICIAL DO EMULATORJS.

       É executado quando o EmulatorJS
       detecta alteração no save.
    */
    window.EJS_onSaveUpdate =
        function(event) {

            console.log(
                "Maceon Play: save atualizado.",
                event
            );

            /*
               Apenas registramos a confirmação.
               Não modificamos o save recebido.
            */

            if (event && event.save) {

                console.log(
                    "Maceon Play: buffer de save recebido."
                );
            }
        };


    /* =====================================
       CARREGAR EMULATORJS
       ===================================== */

    const loader =
        document.createElement("script");

    loader.src =
        "https://cdn.emulatorjs.org/stable/data/loader.js";


    loader.onerror = function() {

        emulatorStarted = false;

        launcher.style.display =
            "flex";

        message.textContent =
            "Não foi possível carregar o emulador.";

        playButton.disabled =
            false;
    };


    document.body.appendChild(loader);
}


/* =========================================
   BOTÃO JOGAR
   ========================================= */

playButton.addEventListener(
    "click",
    function() {

        startEmulator();
    }
);

</script>

</body>
</html>
