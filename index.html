<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">

<title>Maceon Play</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #080808;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
}

.container {
    width: 100%;
    max-width: 1000px;
    padding: 24px;
    text-align: center;
}

.logo {
    font-size: clamp(32px, 8vw, 64px);
    font-weight: 900;
    letter-spacing: 3px;
    margin: 30px 0 8px;
}

.play {
    color: #55d6be;
}

.subtitle {
    color: #bbbbbb;
    margin-bottom: 30px;
}

.start {
    min-height: 420px;
    background: #000000;
    border-radius: 18px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    padding: 25px;
}

.start h2 {
    margin: 0 0 12px;
}

.start p {
    color: #bbbbbb;
    max-width: 520px;
    line-height: 1.45;
}

input[type="file"] {
    display: none;
}

.button {
    display: inline-block;
    margin-top: 18px;
    padding: 16px 28px;
    border: 0;
    border-radius: 12px;

    background: #55d6be;
    color: #07110f;

    font-family: inherit;
    font-weight: bold;
    font-size: 17px;

    cursor: pointer;
}

.secondary {
    margin-top: 16px;
    border: 0;
    background: transparent;
    color: #999999;
    font-size: 14px;
    cursor: pointer;
}

.secondary:hover {
    color: #ffffff;
}

.status {
    color: #55d6be !important;
    font-weight: bold;
}


/* =========================================
   PLAYER — PRESERVA A CORREÇÃO FUNCIONAL
   ========================================= */

#game {
    width: 100%;
    height: 600px;
    max-height: 70vh;

    position: relative;
    overflow: hidden;

    background: #000000;
}

#game.ejs_parent {
    width: 100% !important;
    height: 600px !important;
    max-height: 70vh !important;

    position: relative !important;
    overflow: hidden !important;
}

#game .ejs_canvas_parent {
    position: absolute !important;

    top: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    left: 0 !important;

    width: 100% !important;
    height: 100% !important;

    overflow: hidden !important;
}

#game canvas.ejs_canvas {
    width: 100% !important;
    height: 100% !important;

    max-width: 100% !important;
    max-height: 100% !important;

    display: block !important;
    object-fit: contain !important;
}


@media (max-width: 600px) {

    .container {
        padding: 10px;
    }

    .start {
        min-height: 65vh;
    }

    #game,
    #game.ejs_parent {
        height: 70vh !important;
        max-height: 70vh !important;
    }
}

</style>
</head>


<body>

<main class="container">

    <div id="header">

        <div class="logo">
            MACEON <span class="play">PLAY</span>
        </div>

        <div class="subtitle">
            Toque. Abra. Jogue.
        </div>

    </div>


    <div id="launcher" class="start">

        <h2 id="launcherTitle">
            Game Boy Advance
        </h2>

        <p id="message">
            Verificando jogo armazenado...
        </p>

        <label
            id="selectButton"
            class="button"
            for="romFile"
            style="display:none;"
        >
            SELECIONAR JOGO
        </label>

        <button
            id="playButton"
            class="button"
            type="button"
            style="display:none;"
        >
            JOGAR
        </button>

        <button
            id="removeButton"
            class="secondary"
            type="button"
            style="display:none;"
        >
            Remover jogo deste aparelho
        </button>

        <input
            id="romFile"
            type="file"
            accept=".gba,.zip"
        >

    </div>


    <div id="game"></div>

</main>


<script>

/* =========================================
   MACEON PLAY
   Armazenamento local do jogo com IndexedDB
   ========================================= */

const DB_NAME = "MaceonPlayDB";
const DB_VERSION = 1;
const STORE_NAME = "games";
const GAME_KEY = "gba-main";


const romInput =
    document.getElementById("romFile");

const launcher =
    document.getElementById("launcher");

const message =
    document.getElementById("message");

const selectButton =
    document.getElementById("selectButton");

const playButton =
    document.getElementById("playButton");

const removeButton =
    document.getElementById("removeButton");


let storedGame = null;
let emulatorStarted = false;


/* =========================================
   ABRIR BANCO LOCAL
   ========================================= */

function openDatabase() {

    return new Promise((resolve, reject) => {

        const request =
            indexedDB.open(DB_NAME, DB_VERSION);


        request.onupgradeneeded = function(event) {

            const db =
                event.target.result;

            if (!db.objectStoreNames.contains(STORE_NAME)) {

                db.createObjectStore(STORE_NAME);
            }
        };


        request.onsuccess = function(event) {

            resolve(event.target.result);
        };


        request.onerror = function() {

            reject(request.error);
        };
    });
}


/* =========================================
   SALVAR JOGO LOCALMENTE
   ========================================= */

async function saveGame(file) {

    const db =
        await openDatabase();

    return new Promise((resolve, reject) => {

        const transaction =
            db.transaction(
                STORE_NAME,
                "readwrite"
            );

        const store =
            transaction.objectStore(STORE_NAME);


        const gameData = {

            name: file.name,

            type:
                file.type ||
                "application/octet-stream",

            blob: file,

            savedAt: Date.now()
        };


        const request =
            store.put(
                gameData,
                GAME_KEY
            );


        request.onsuccess = function() {

            resolve(gameData);
        };


        request.onerror = function() {

            reject(request.error);
        };


        transaction.oncomplete = function() {

            db.close();
        };
    });
}


/* =========================================
   LER JOGO ARMAZENADO
   ========================================= */

async function loadStoredGame() {

    const db =
        await openDatabase();

    return new Promise((resolve, reject) => {

        const transaction =
            db.transaction(
                STORE_NAME,
                "readonly"
            );

        const store =
            transaction.objectStore(STORE_NAME);


        const request =
            store.get(GAME_KEY);


        request.onsuccess = function() {

            resolve(request.result || null);
        };


        request.onerror = function() {

            reject(request.error);
        };


        transaction.oncomplete = function() {

            db.close();
        };
    });
}


/* =========================================
   REMOVER JOGO ARMAZENADO
   ========================================= */

async function deleteStoredGame() {

    const db =
        await openDatabase();

    return new Promise((resolve, reject) => {

        const transaction =
            db.transaction(
                STORE_NAME,
                "readwrite"
            );

        const store =
            transaction.objectStore(STORE_NAME);


        const request =
            store.delete(GAME_KEY);


        request.onsuccess = function() {

            resolve();
        };


        request.onerror = function() {

            reject(request.error);
        };


        transaction.oncomplete = function() {

            db.close();
        };
    });
}


/* =========================================
   INICIAR EMULATORJS
   ========================================= */

function startEmulator(gameData) {

    if (emulatorStarted) {
        return;
    }

    emulatorStarted = true;


    const gameURL =
        URL.createObjectURL(gameData.blob);


    const gameName =
        gameData.name.replace(
            /\.[^/.]+$/,
            ""
        );


    launcher.style.display = "none";


    /*
       Configuração que já comprovamos
       funcionar no Maceon Play.
    */

    window.EJS_player = "#game";

    window.EJS_gameName = gameName;

    window.EJS_gameID =
        "maceon-play-gba";

    window.EJS_gameUrl =
        gameURL;

    window.EJS_core =
        "gba";

    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/stable/data/";

    window.EJS_startOnLoaded =
        true;

    window.EJS_language =
        "pt-BR";


    const loader =
        document.createElement("script");


    loader.src =
        "https://cdn.emulatorjs.org/stable/data/loader.js";


    loader.onerror = function() {

        emulatorStarted = false;

        launcher.style.display =
            "flex";

        message.textContent =
            "Não foi possível carregar o emulador.";

        playButton.style.display =
            "inline-block";
    };


    document.body.appendChild(loader);
}


/* =========================================
   PRIMEIRA SELEÇÃO
   ========================================= */

romInput.addEventListener(
    "change",
    async function(event) {

        const file =
            event.target.files[0];


        if (!file) {
            return;
        }


        message.textContent =
            "Guardando jogo neste aparelho...";


        selectButton.style.display =
            "none";


        try {

            storedGame =
                await saveGame(file);


            message.textContent =
                "Jogo armazenado. Iniciando...";


            startEmulator(storedGame);

        }
        catch (error) {

            console.error(error);


            message.textContent =
                "Não foi possível guardar o jogo neste navegador.";


            selectButton.style.display =
                "inline-block";
        }
    }
);


/* =========================================
   BOTÃO JOGAR
   ========================================= */

playButton.addEventListener(
    "click",
    function() {

        if (storedGame) {

            startEmulator(storedGame);
        }
    }
);


/* =========================================
   BOTÃO REMOVER
   ========================================= */

removeButton.addEventListener(
    "click",
    async function() {

        const confirmed =
            confirm(
                "Remover o jogo armazenado deste aparelho?"
            );


        if (!confirmed) {
            return;
        }


        try {

            await deleteStoredGame();


            storedGame = null;


            message.textContent =
                "Jogo removido. Selecione novamente quando quiser jogar.";


            playButton.style.display =
                "none";


            removeButton.style.display =
                "none";


            selectButton.style.display =
                "inline-block";
        }
        catch (error) {

            console.error(error);

            alert(
                "Não foi possível remover o jogo armazenado."
            );
        }
    }
);


/* =========================================
   VERIFICAÇÃO AO ABRIR MACEON PLAY
   ========================================= */

async function initializeMaceonPlay() {

    try {

        storedGame =
            await loadStoredGame();


        if (storedGame) {

            message.innerHTML =
                "Jogo encontrado neste aparelho.<br>Pronto para continuar.";


            playButton.style.display =
                "inline-block";


            removeButton.style.display =
                "inline-block";
        }
        else {

            message.textContent =
                "Selecione no seu aparelho um jogo GBA que você possua. Ele ficará armazenado localmente neste navegador.";


            selectButton.style.display =
                "inline-block";
        }
    }
    catch (error) {

        console.error(error);


        message.textContent =
            "O armazenamento local não está disponível. Você ainda pode selecionar o jogo para esta sessão.";


        selectButton.style.display =
            "inline-block";
    }
}


initializeMaceonPlay();

</script>

</body>

</html>
