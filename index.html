<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">

<title>Maceon Play</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #080808;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
}

.container {
    width: 100%;
    max-width: 1000px;
    padding: 24px;
    text-align: center;
}

.logo {
    font-size: clamp(32px, 8vw, 64px);
    font-weight: 900;
    letter-spacing: 3px;
    margin: 30px 0 8px;
}

.play {
    color: #55d6be;
}

.subtitle {
    color: #bbbbbb;
    margin-bottom: 30px;
}

.start {
    min-height: 420px;
    background: #000000;
    border-radius: 18px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    padding: 25px;
}

.start h2 {
    margin: 0 0 12px;
}

.start p {
    color: #bbbbbb;
    max-width: 520px;
    line-height: 1.45;
}

.button {
    display: inline-block;
    margin-top: 18px;
    padding: 16px 34px;

    border: 0;
    border-radius: 12px;

    background: #55d6be;
    color: #07110f;

    font-family: inherit;
    font-weight: bold;
    font-size: 18px;

    cursor: pointer;
}

.button:hover {
    filter: brightness(1.08);
}


/* =========================================
   PLAYER — CORREÇÃO FUNCIONAL PRESERVADA
   ========================================= */

#game {
    width: 100%;
    height: 600px;
    max-height: 70vh;

    position: relative;
    overflow: hidden;

    background: #000000;
}

#game.ejs_parent {
    width: 100% !important;
    height: 600px !important;
    max-height: 70vh !important;

    position: relative !important;
    overflow: hidden !important;
}

#game .ejs_canvas_parent {
    position: absolute !important;

    top: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    left: 0 !important;

    width: 100% !important;
    height: 100% !important;

    overflow: hidden !important;
}

#game canvas.ejs_canvas {
    width: 100% !important;
    height: 100% !important;

    max-width: 100% !important;
    max-height: 100% !important;

    display: block !important;
    object-fit: contain !important;
}

@media (max-width: 600px) {

    .container {
        padding: 10px;
    }

    .start {
        min-height: 65vh;
    }

    #game,
    #game.ejs_parent {
        height: 70vh !important;
        max-height: 70vh !important;
    }
}

</style>
</head>

<body>

<main class="container">

    <div id="header">

        <div class="logo">
            MACEON <span class="play">PLAY</span>
        </div>

        <div class="subtitle">
            Toque. Abra. Jogue.
        </div>

    </div>


    <div id="launcher" class="start">

        <h2>
            Game Boy Advance
        </h2>

        <p id="message">
            Pronto para jogar.
        </p>

        <button
            id="playButton"
            class="button"
            type="button"
        >
            ▶ JOGAR
        </button>

    </div>


    <div id="game"></div>

</main>


<script>

/* =========================================
   MACEON PLAY
   PLAY DIRETO + SAVE SRM LOCAL
   ========================================= */

const GAME_URL =
    "./games/jogo.gba";

const GAME_NAME =
    "Maceon Play";

const GAME_ID =
    1001;


/* =========================================
   BANCO LOCAL DO SAVE
   ========================================= */

const DB_NAME =
    "MaceonPlaySaves";

const DB_VERSION =
    1;

const STORE_NAME =
    "saves";

const SAVE_KEY =
    "gba-main-srm";


const launcher =
    document.getElementById("launcher");

const message =
    document.getElementById("message");

const playButton =
    document.getElementById("playButton");


let emulatorStarted =
    false;

let saveBlobUrl =
    null;


/* =========================================
   ABRIR INDEXEDDB
   ========================================= */

function openSaveDatabase() {

    return new Promise(
        function(resolve, reject) {

            const request =
                indexedDB.open(
                    DB_NAME,
                    DB_VERSION
                );


            request.onupgradeneeded =
                function(event) {

                    const db =
                        event.target.result;

                    if (
                        !db.objectStoreNames.contains(
                            STORE_NAME
                        )
                    ) {

                        db.createObjectStore(
                            STORE_NAME
                        );
                    }
                };


            request.onsuccess =
                function() {

                    resolve(
                        request.result
                    );
                };


            request.onerror =
                function() {

                    reject(
                        request.error
                    );
                };
        }
    );
}


/* =========================================
   GUARDAR SRM
   ========================================= */

async function storeSaveBuffer(buffer) {

    const bytes =
        buffer instanceof Uint8Array
            ? buffer
            : new Uint8Array(buffer);


    /*
       Faz uma cópia independente dos bytes.
    */

    const copy =
        bytes.slice();


    const db =
        await openSaveDatabase();


    return new Promise(
        function(resolve, reject) {

            const transaction =
                db.transaction(
                    STORE_NAME,
                    "readwrite"
                );

            const store =
                transaction.objectStore(
                    STORE_NAME
                );


            store.put(
                {
                    bytes: copy,
                    size: copy.byteLength,
                    savedAt:
                        new Date().toISOString()
                },
                SAVE_KEY
            );


            transaction.oncomplete =
                function() {

                    db.close();

                    console.log(
                        "Maceon Play: SRM armazenado.",
                        copy.byteLength,
                        "bytes"
                    );

                    resolve();
                };


            transaction.onerror =
                function() {

                    const error =
                        transaction.error;

                    db.close();

                    reject(error);
                };
        }
    );
}


/* =========================================
   RECUPERAR SRM
   ========================================= */

async function getStoredSave() {

    const db =
        await openSaveDatabase();


    return new Promise(
        function(resolve, reject) {

            const transaction =
                db.transaction(
                    STORE_NAME,
                    "readonly"
                );

            const store =
                transaction.objectStore(
                    STORE_NAME
                );

            const request =
                store.get(
                    SAVE_KEY
                );


            request.onsuccess =
                function() {

                    const result =
                        request.result;

                    db.close();

                    resolve(result || null);
                };


            request.onerror =
                function() {

                    const error =
                        request.error;

                    db.close();

                    reject(error);
                };
        }
    );
}


/* =========================================
   PREPARAR SAVE PARA RESTAURAÇÃO
   ========================================= */

async function prepareStoredSave() {

    try {

        const stored =
            await getStoredSave();


        if (
            !stored ||
            !stored.bytes
        ) {

            console.log(
                "Maceon Play: nenhum SRM local encontrado."
            );

            return false;
        }


        const bytes =
            stored.bytes instanceof Uint8Array
                ? stored.bytes
                : new Uint8Array(
                    stored.bytes
                );


        console.log(
            "Maceon Play: SRM local encontrado:",
            bytes.byteLength,
            "bytes"
        );


        /*
           Cria uma URL temporária para o arquivo
           armazenado no IndexedDB.
        */

        const blob =
            new Blob(
                [bytes],
                {
                    type:
                        "application/octet-stream"
                }
            );


        saveBlobUrl =
            URL.createObjectURL(blob);


        /*
           EJS_externalFiles é uma opção oficial
           do EmulatorJS.

           Colocamos o SRM no caminho usado
           pelo core mGBA.
        */

        window.EJS_externalFiles = {
            "/data/saves/mGBA/sram.srm":
                saveBlobUrl
        };


        console.log(
            "Maceon Play: SRM preparado para restauração."
        );


        return true;

    }

    catch (error) {

        console.error(
            "Maceon Play: erro ao preparar SRM.",
            error
        );

        return false;
    }
}


/* =========================================
   INICIAR EMULATORJS
   ========================================= */

async function startEmulator() {

    if (emulatorStarted) {
        return;
    }


    emulatorStarted =
        true;

    playButton.disabled =
        true;

    message.textContent =
        "Preparando jogo...";


    /*
       PRIMEIRO procuramos um save existente.

       Isso acontece ANTES de carregar
       o EmulatorJS.
    */

    await prepareStoredSave();


    message.textContent =
        "Carregando jogo...";


    launcher.style.display =
        "none";


    /* =====================================
       CONFIGURAÇÃO EMULATORJS
       ===================================== */

    window.EJS_player =
        "#game";

    window.EJS_gameName =
        GAME_NAME;

    window.EJS_gameID =
        GAME_ID;

    window.EJS_gameUrl =
        GAME_URL;

    window.EJS_core =
        "gba";

    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/stable/data/";

    window.EJS_startOnLoaded =
        true;

    window.EJS_language =
        "pt-BR";


    /*
       Mantemos a sincronização periódica.
    */

    window.EJS_fixedSaveInterval =
        7000;


    /* =====================================
       CAPTURAR O SRM
       =====================================

       Este callback é acionado pelo comando
       "Save SAV Files" do EmulatorJS.

       Em vez de baixar jogo.srm,
       guardaremos os bytes no IndexedDB.
    */

    window.EJS_onSaveSave =
        async function(event) {

            if (
                !event ||
                !event.save
            ) {

                console.error(
                    "Maceon Play: EmulatorJS não forneceu o SRM."
                );

                return;
            }


            try {

                const bytes =
                    event.save instanceof Uint8Array
                        ? event.save
                        : new Uint8Array(
                            event.save
                        );


                console.log(
                    "Maceon Play: SRM recebido:",
                    bytes.byteLength,
                    "bytes"
                );


                await storeSaveBuffer(
                    bytes
                );


                console.log(
                    "Maceon Play: PROGRESSO SALVO NO NAVEGADOR."
                );

            }

            catch (error) {

                console.error(
                    "Maceon Play: erro ao armazenar SRM.",
                    error
                );
            }
        };


    /* =====================================
       CARREGAR EMULATORJS
       ===================================== */

    const loader =
        document.createElement(
            "script"
        );


    loader.src =
        "https://cdn.emulatorjs.org/stable/data/loader.js";


    loader.onerror =
        function() {

            emulatorStarted =
                false;

            launcher.style.display =
                "flex";

            message.textContent =
                "Não foi possível carregar o emulador.";

            playButton.disabled =
                false;
        };


    document.body.appendChild(
        loader
    );
}


/* =========================================
   BOTÃO JOGAR
   ========================================= */

playButton.addEventListener(
    "click",
    function() {

        startEmulator();
    }
);

</script>

</body>
</html>
