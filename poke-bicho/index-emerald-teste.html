<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>Maceon Play — Teste Jogo 003</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    min-height: 100%;
    background: #080808;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
}

.container {
    width: 100%;
    max-width: 1000px;
    padding: 24px;
    text-align: center;
}

.test-launcher {
    max-width: 650px;
    margin: 30px auto;
    padding: 28px;
    background: #161616;
    border: 1px solid #55d6be;
    border-radius: 18px;
}

.logo {
    margin: 0 0 8px;
    font-size: clamp(34px, 8vw, 58px);
    font-weight: 900;
    letter-spacing: 2px;
}

.logo span {
    color: #55d6be;
}

.subtitle {
    color: #bbb;
    margin: 0 0 26px;
}

.game-name {
    font-size: clamp(24px, 5vw, 38px);
    margin: 12px 0 6px;
}

.game-id {
    color: #999;
    margin-bottom: 24px;
}

.primary-button {
    display: block;
    width: 100%;
    padding: 16px;
    border: 0;
    border-radius: 12px;
    background: #55d6be;
    color: #07110f;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    touch-action: manipulation;
}

.primary-button:disabled {
    opacity: .6;
    cursor: wait;
}

.status {
    margin-top: 16px;
    color: #bbb;
    font-size: 14px;
    line-height: 1.5;
}

/* PLAYER */

#game {
    width: 100%;
    height: 600px;
    max-height: 70vh;
    position: relative;
    overflow: hidden;
    background: black;
}

#game.ejs_parent {
    width: 100% !important;
    height: 600px !important;
    max-height: 70vh !important;
    position: relative !important;
    overflow: hidden !important;
}

#game .ejs_canvas_parent {
    position: absolute !important;
    inset: 0 !important;
    width: 100% !important;
    height: 100% !important;
    overflow: hidden !important;
}

#game canvas.ejs_canvas {
    width: 100% !important;
    height: 100% !important;
    max-width: 100% !important;
    max-height: 100% !important;
    display: block !important;
    object-fit: contain !important;
}

@media (max-width: 600px) {
    .container {
        padding: 10px;
    }

    .test-launcher {
        margin: 15px auto;
        padding: 20px;
    }

    #game,
    #game.ejs_parent {
        height: 70vh !important;
        max-height: 70vh !important;
    }
}
</style>
</head>

<body>

<main class="container">

<section id="launcher" class="test-launcher">

    <h1 class="logo">
        MACEON <span>PLAY</span>
    </h1>

    <p class="subtitle">
        Teste isolado
    </p>

    <h2 class="game-name">
        Emerald Arena
    </h2>

    <p class="game-id">
        Jogo 003
    </p>

    <button
        id="playButton"
        class="primary-button"
        type="button"
    >
        JOGAR
    </button>

    <p id="status" class="status">
        Pronto para testar o Jogo 003.
    </p>

</section>

<div id="game" hidden></div>

</main>

<script>
"use strict";

/* =========================================
   JOGO 003 — EMERALD ARENA
   ========================================= */

const GAME = {
    name: "Emerald Arena",
    url: "./games3/jogo3.gba",
    emulatorId: 1003,
    saveKey: "gba-game-003-srm"
};

const launcher =
    document.getElementById("launcher");

const playButton =
    document.getElementById("playButton");

const status =
    document.getElementById("status");

const gameElement =
    document.getElementById("game");

let emulatorStarted = false;
let automaticSaveTimer = null;
let lastAutomaticSaveSignature = null;


/* =========================================
   BANCO DE SAVES
   ========================================= */

const DB_NAME = "MaceonPlaySaves";
const DB_VERSION = 1;
const STORE_NAME = "saves";


function openSaveDatabase() {

    return new Promise(function(resolve, reject) {

        const request =
            indexedDB.open(DB_NAME, DB_VERSION);

        request.onupgradeneeded = function(event) {

            const db = event.target.result;

            if (!db.objectStoreNames.contains(STORE_NAME)) {
                db.createObjectStore(STORE_NAME);
            }
        };

        request.onsuccess = function() {
            resolve(request.result);
        };

        request.onerror = function() {
            reject(request.error);
        };

    });
}


/* =========================================
   ARMAZENAR SAVE
   ========================================= */

async function storeSaveBuffer(buffer) {

    const bytes =
        buffer instanceof Uint8Array
            ? buffer
            : new Uint8Array(buffer);

    const copy = bytes.slice();

    const db =
        await openSaveDatabase();

    return new Promise(function(resolve, reject) {

        const transaction =
            db.transaction(
                STORE_NAME,
                "readwrite"
            );

        transaction
            .objectStore(STORE_NAME)
            .put(
                {
                    bytes: copy,
                    size: copy.byteLength,
                    savedAt: new Date().toISOString()
                },
                GAME.saveKey
            );

        transaction.oncomplete = function() {

            db.close();

            console.log(
                "Maceon Play 003: save armazenado.",
                copy.byteLength,
                "bytes"
            );

            resolve();
        };

        transaction.onerror = function() {

            const error =
                transaction.error;

            db.close();

            reject(error);
        };

    });
}


/* =========================================
   LER SAVE ARMAZENADO
   ========================================= */

async function getStoredSave() {

    const db =
        await openSaveDatabase();

    return new Promise(function(resolve, reject) {

        const transaction =
            db.transaction(
                STORE_NAME,
                "readonly"
            );

        const request =
            transaction
                .objectStore(STORE_NAME)
                .get(GAME.saveKey);

        request.onsuccess = function() {

            const result =
                request.result;

            db.close();

            resolve(result || null);
        };

        request.onerror = function() {

            const error =
                request.error;

            db.close();

            reject(error);
        };

    });
}


/* =========================================
   ASSINATURA DO SAVE
   ========================================= */

function makeSaveSignature(bytes) {

    if (!bytes || !bytes.byteLength) {
        return null;
    }

    let hash = 2166136261;

    for (
        let i = 0;
        i < bytes.length;
        i += 64
    ) {
        hash ^= bytes[i];

        hash =
            Math.imul(
                hash,
                16777619
            );
    }

    return (
        bytes.byteLength +
        ":" +
        (hash >>> 0)
    );
}


/* =========================================
   GAME MANAGER
   ========================================= */

function getGameManager() {

    const emulator =
        window.EJS_emulator;

    if (
        !emulator ||
        !emulator.gameManager
    ) {
        return null;
    }

    return emulator.gameManager;
}


/* =========================================
   LER SAVE DO CORE
   ========================================= */

function readCurrentSRM() {

    try {

        const gameManager =
            getGameManager();

        if (
            !gameManager ||
            typeof gameManager.getSaveFile !== "function"
        ) {
            return null;
        }

        const save =
            gameManager.getSaveFile();

        if (
            !save ||
            !save.byteLength
        ) {
            return null;
        }

        return save instanceof Uint8Array
            ? save.slice()
            : new Uint8Array(save);

    } catch (error) {

        console.error(
            "Maceon Play 003: erro ao obter save.",
            error
        );

        return null;
    }
}


/* =========================================
   CAPTURA AUTOMÁTICA
   ========================================= */

async function captureCurrentSRM(force = false) {

    if (!emulatorStarted) {
        return false;
    }

    try {

        const bytes =
            readCurrentSRM();

        if (!bytes) {
            return false;
        }

        const signature =
            makeSaveSignature(bytes);

        if (
            !force &&
            signature === lastAutomaticSaveSignature
        ) {
            return false;
        }

        await storeSaveBuffer(bytes);

        lastAutomaticSaveSignature =
            signature;

        console.log(
            "Maceon Play 003: save automático capturado."
        );

        return true;

    } catch (error) {

        console.error(
            "Maceon Play 003: erro no save automático.",
            error
        );

        return false;
    }
}


function startAutomaticSaveMonitor() {

    if (automaticSaveTimer) {
        clearInterval(
            automaticSaveTimer
        );
    }

    automaticSaveTimer =
        setInterval(
            function() {
                captureCurrentSRM(false);
            },
            7000
        );
}


/* =========================================
   RESTAURAR SAVE
   ========================================= */

async function restoreStoredSave() {

    try {

        const stored =
            await getStoredSave();

        if (
            !stored ||
            !stored.bytes
        ) {

            console.log(
                "Maceon Play 003: nenhum save local encontrado."
            );

            return false;
        }

        const bytes =
            stored.bytes instanceof Uint8Array
                ? stored.bytes
                : new Uint8Array(stored.bytes);

        const timeout =
            Date.now() + 15000;

        while (
            Date.now() < timeout
        ) {

            const gameManager =
                getGameManager();

            if (
                gameManager &&
                gameManager.FS &&
                typeof gameManager.getSaveFilePath === "function"
            ) {

                const FS =
                    gameManager.FS;

                const savePath =
                    gameManager.getSaveFilePath();

                if (!savePath) {
                    return false;
                }

                const parts =
                    savePath.split("/");

                let currentPath = "";

                for (
                    let i = 0;
                    i < parts.length - 1;
                    i++
                ) {

                    if (!parts[i]) {
                        continue;
                    }

                    currentPath +=
                        "/" + parts[i];

                    try {

                        if (
                            !FS.analyzePath(
                                currentPath
                            ).exists
                        ) {
                            FS.mkdir(
                                currentPath
                            );
                        }

                    } catch (error) {

                        try {
                            FS.mkdir(
                                currentPath
                            );
                        } catch (ignored) {}

                    }
                }

                try {

                    if (
                        FS.analyzePath(
                            savePath
                        ).exists
                    ) {
                        FS.unlink(
                            savePath
                        );
                    }

                } catch (ignored) {}


                FS.writeFile(
                    savePath,
                    bytes
                );


                if (
                    typeof gameManager.loadSaveFiles !== "function"
                ) {
                    return false;
                }


                const result =
                    gameManager.loadSaveFiles();


                if (
                    result &&
                    typeof result.then === "function"
                ) {
                    await result;
                }


                lastAutomaticSaveSignature =
                    makeSaveSignature(bytes);


                console.log(
                    "Maceon Play 003: save restaurado."
                );


                return true;
            }


            await new Promise(
                function(resolve) {
                    setTimeout(
                        resolve,
                        100
                    );
                }
            );
        }


        return false;


    } catch (error) {

        console.error(
            "Maceon Play 003: erro na restauração.",
            error
        );

        return false;
    }
}


/* =========================================
   INICIAR EMULADOR
   ========================================= */

function startEmulator() {

    if (emulatorStarted) {
        return;
    }


    emulatorStarted = true;

    playButton.disabled = true;

    status.textContent =
        "Carregando Emerald Arena...";


    launcher.style.display =
        "none";

    gameElement.hidden =
        false;


    window.EJS_player =
        "#game";

    window.EJS_gameName =
        GAME.name;

    window.EJS_gameID =
        GAME.emulatorId;

    window.EJS_gameUrl =
        GAME.url;

    window.EJS_core =
        "gba";


    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/stable/data/";

    window.EJS_startOnLoaded =
        true;

    window.EJS_language =
        "pt-BR";

    window.EJS_fixedSaveInterval =
        7000;


    /* SAVE MANUAL */

    window.EJS_onSaveSave =
        async function(event) {

            if (
                !event ||
                !event.save
            ) {
                return;
            }

            try {

                const bytes =
                    event.save instanceof Uint8Array
                        ? event.save
                        : new Uint8Array(
                            event.save
                        );


                await storeSaveBuffer(
                    bytes
                );


                lastAutomaticSaveSignature =
                    makeSaveSignature(
                        bytes
                    );


            } catch (error) {

                console.error(
                    "Maceon Play 003: erro no save manual.",
                    error
                );
            }
        };


    /* JOGO INICIADO */

    window.EJS_onGameStart =
        async function() {

            console.log(
                "Maceon Play 003: jogo iniciado."
            );

            await restoreStoredSave();

            startAutomaticSaveMonitor();
        };


    /* CARREGAR EMULATORJS */

    const loader =
        document.createElement(
            "script"
        );


    loader.src =
        "https://cdn.emulatorjs.org/stable/data/loader.js";


    loader.onerror =
        function() {

            emulatorStarted =
                false;

            launcher.style.display =
                "block";

            gameElement.hidden =
                true;

            status.textContent =
                "Não foi possível carregar o emulador.";

            playButton.disabled =
                false;
        };


    document.body.appendChild(
        loader
    );
}


/* =========================================
   BOTÃO JOGAR
   ========================================= */

playButton.addEventListener(
    "click",
    startEmulator
);


/* =========================================
   SALVAR AO SAIR
   ========================================= */

document.addEventListener(
    "visibilitychange",
    function() {

        if (
            document.visibilityState === "hidden" &&
            emulatorStarted
        ) {
            captureCurrentSRM(true);
        }
    }
);


window.addEventListener(
    "pagehide",
    function() {

        if (emulatorStarted) {
            captureCurrentSRM(true);
        }
    }
);


window.addEventListener(
    "beforeunload",
    function() {

        if (emulatorStarted) {
            captureCurrentSRM(true);
        }
    }
);

</script>

</body>
</html>
