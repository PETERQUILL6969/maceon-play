<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>Maceon Play</title>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    min-height: 100%;
    background: #080808;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
}

.container {
    width: 100%;
    max-width: 1000px;
    padding: 24px;
    text-align: center;
}

.catalog {
    display: none;
    max-width: 780px;
    margin: auto;
    padding: 20px 0 35px;
}

.catalog-logo {
    margin: 18px 0 8px;
    font-size: clamp(34px, 8vw, 62px);
    font-weight: 900;
    letter-spacing: 2px;
}

.catalog-logo span { color: #55d6be; }

.catalog-subtitle {
    color: #bbb;
    font-size: 18px;
    margin-bottom: 30px;
}

.game-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
}

.game-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    min-width: 0;
    padding: 16px;
    border: 1px solid #55d6be;
    border-radius: 18px;
    background: #161616;
    color: white;
    text-decoration: none;
}

.game-card:hover { background: #1c2926; }

.game-cover {
    display: block;
    width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    border-radius: 12px;
    background: #222;
}

.game-card strong {
    font-size: clamp(17px, 3vw, 24px);
}

.game-card small {
    color: #bbb;
    font-size: 14px;
}

.game-action {
    display: block;
    width: 100%;
    margin-top: auto;
    padding: 13px 10px;
    border-radius: 11px;
    background: #55d6be;
    color: #07110f;
    font-weight: 800;
}

.catalog-note {
    margin-top: 24px;
    color: #999;
    font-size: 13px;
    line-height: 1.5;
}

.nav {
    text-align: left;
    margin-bottom: 14px;
}

.nav a { color: #55d6be; }

.cover-launcher,
.leaf-launcher,
.emerald-launcher {
    position: relative;
    max-width: 650px;
    margin: auto;
    padding: 0;
    background: black;
    overflow: hidden;
    border-radius: 18px;
}

.leaf-launcher,
.emerald-launcher {
    display: none;
}

.cover-image {
    display: block;
    width: 100%;
    height: auto;
    user-select: none;
    -webkit-user-drag: none;
}

/* FIRE RED */

.cover-play-button {
    position: absolute;
    left: 17.5%;
    top: 59%;
    width: 65%;
    height: 10.2%;
    border: 0;
    border-radius: 18px;
    background: transparent;
    cursor: pointer;
    touch-action: manipulation;
    z-index: 10;
}

/* LEAF GREEN */

.leaf-play-button {
    position: absolute;
    left: 19%;
    top: 59.5%;
    width: 62%;
    height: 9%;
    border: 0;
    border-radius: 18px;
    background: transparent;
    cursor: pointer;
    touch-action: manipulation;
    z-index: 10;
}

/* EMERALD ARENA */

.emerald-play-button {
    position: absolute;
    left: 18%;
    top: 58.5%;
    width: 64%;
    height: 10.5%;
    border: 0;
    border-radius: 18px;
    background: transparent;
    cursor: pointer;
    touch-action: manipulation;
    z-index: 10;
}

.cover-play-button:focus-visible,
.leaf-play-button:focus-visible,
.emerald-play-button:focus-visible {
    outline: 4px solid white;
    outline-offset: -5px;
}

.cover-play-button:disabled,
.leaf-play-button:disabled,
.emerald-play-button:disabled {
    cursor: wait;
}

.sr-only {
    position: absolute !important;
    width: 1px !important;
    height: 1px !important;
    padding: 0 !important;
    margin: -1px !important;
    overflow: hidden !important;
    clip: rect(0, 0, 0, 0) !important;
    white-space: nowrap !important;
    border: 0 !important;
}

.load-error {
    position: absolute !important;
    left: 8% !important;
    right: 8% !important;
    bottom: 4% !important;
    width: auto !important;
    height: auto !important;
    margin: 0 !important;
    padding: 10px 12px !important;
    clip: auto !important;
    overflow: visible !important;
    white-space: normal !important;
    border-radius: 10px;
    background: rgba(0,0,0,.85);
    color: white !important;
    z-index: 15;
}

#game {
    width: 100%;
    height: 600px;
    max-height: 70vh;
    position: relative;
    overflow: hidden;
    background: black;
}

#game.ejs_parent {
    width: 100% !important;
    height: 600px !important;
    max-height: 70vh !important;
    position: relative !important;
    overflow: hidden !important;
}

#game .ejs_canvas_parent {
    position: absolute !important;
    inset: 0 !important;
    width: 100% !important;
    height: 100% !important;
    overflow: hidden !important;
}

#game canvas.ejs_canvas {
    width: 100% !important;
    height: 100% !important;
    max-width: 100% !important;
    max-height: 100% !important;
    display: block !important;
    object-fit: contain !important;
}

@media (max-width: 600px) {
    .container { padding: 10px; }
    .game-grid { gap: 10px; }
    .game-card { padding: 9px; gap: 9px; }
    .game-action {
        padding: 12px 5px;
        font-size: 14px;
    }

    #game, #game.ejs_parent {
        height: 70vh !important;
        max-height: 70vh !important;
    }
}
</style>
</head>

<body>
<main class="container">

<!-- CATÁLOGO -->

<section id="catalog" class="catalog">

    <h1 class="catalog-logo">
        MACEON <span>PLAY</span>
    </h1>

    <p class="catalog-subtitle">
        Escolha seu jogo
    </p>

    <div class="game-grid">

        <!-- JOGO 001 -->
        <a class="game-card" href="?game=001">
            <img
                class="game-cover"
                src="./firered-cover.jpg"
                alt="Capa do FireRed"
            >
            <strong>Pokémon FireRed</strong>
            <small>PT-BR · Jogo 001</small>
            <span class="game-action">JOGAR</span>
        </a>

        <!-- JOGO 002 -->
        <a class="game-card" href="?game=002">
            <img
                class="game-cover"
                src="./leafgreen-cover.png"
                alt="Capa do LeafGreen"
            >
            <strong>Pokémon LeafGreen</strong>
            <small>PT-BR · Jogo 002</small>
            <span class="game-action">JOGAR</span>
        </a>

        <!-- JOGO 003 -->
        <a class="game-card" href="?game=003">
            <img
                class="game-cover"
                src="./emerald-catalogo.jpg"
                alt="Capa do Emerald Arena"
            >
            <strong>Emerald Arena</strong>
            <small>Jogo 003</small>
            <span class="game-action">JOGAR</span>
        </a>

    </div>

    <p class="catalog-note">
        Os jogos e seus progressos ficam separados.
    </p>

</section>

<!-- NAVEGAÇÃO -->

<nav id="navigation" class="nav" hidden>
    <a href="?catalog=1">← Voltar aos jogos</a>
</nav>

<!-- ENTRADA JOGO 001 -->

<div id="launcher" class="cover-launcher" hidden>

    <img
        class="cover-image"
        src="./maceon-play-cover.png"
        alt="Maceon Play — Pokémon FireRed"
    >

    <p id="message" class="sr-only">
        Pronto para jogar.
    </p>

    <button
        id="playButton"
        class="cover-play-button"
        type="button"
        aria-label="Jogar Pokémon FireRed"
    >
        <span class="sr-only">JOGAR</span>
    </button>

</div>

<!-- ENTRADA JOGO 002 -->

<section id="leafLauncher" class="leaf-launcher">

    <img
        class="cover-image"
        src="./leafgreen-version.jpg"
        alt="Maceon Play — Jogo 002"
    >

    <p id="leafStatus" class="sr-only">
        Pronto para jogar.
    </p>

    <button
        id="leafPlayButton"
        class="leaf-play-button"
        type="button"
        aria-label="Jogar Jogo 002"
    >
        <span class="sr-only">JOGAR</span>
    </button>

</section>

<!-- ENTRADA JOGO 003 -->

<section id="emeraldLauncher" class="emerald-launcher">

    <img
        class="cover-image"
        src="./emerald-jogo-03.jpg"
        alt="Maceon Play — Emerald Arena"
    >

    <p id="emeraldStatus" class="sr-only">
        Pronto para jogar.
    </p>

    <button
        id="emeraldPlayButton"
        class="emerald-play-button"
        type="button"
        aria-label="Jogar Emerald Arena"
    >
        <span class="sr-only">JOGAR</span>
    </button>

</section>

<!-- EMULADOR -->

<div id="game" hidden></div>

</main>

<script>
"use strict";

/* CONFIGURAÇÃO DOS TRÊS JOGOS */

const GAMES = {
    "001": {
        name: "Maceon Play",
        url: "./games/jogo.gba",
        emulatorId: 1001,
        saveKey: "gba-main-srm",
        available: true
    },

    "002": {
        name: "Pokémon LeafGreen – PT-BR",
        url: "./games2/jogo2.gba",
        emulatorId: 1002,
        saveKey: "gba-game-002-srm",
        available: true
    },

    "003": {
        name: "Emerald Arena",
        url: "./games3/jogo3.gba",
        emulatorId: 1003,
        saveKey: "gba-game-003-srm",
        available: true
    }
};

const params = new URLSearchParams(location.search);
const selectedId = params.get("game");
const selectedGame = GAMES[selectedId] || null;
const showCatalog =
    params.get("catalog") === "1" || !selectedId;

const catalog = document.getElementById("catalog");
const navigation = document.getElementById("navigation");

const launcher = document.getElementById("launcher");
const message = document.getElementById("message");
const playButton = document.getElementById("playButton");

const leafLauncher =
    document.getElementById("leafLauncher");
const leafStatus =
    document.getElementById("leafStatus");
const leafPlayButton =
    document.getElementById("leafPlayButton");

const emeraldLauncher =
    document.getElementById("emeraldLauncher");
const emeraldStatus =
    document.getElementById("emeraldStatus");
const emeraldPlayButton =
    document.getElementById("emeraldPlayButton");

const gameElement = document.getElementById("game");

let emulatorStarted = false;
let automaticSaveTimer = null;
let lastAutomaticSaveSignature = null;

/* BANCO DE DADOS DOS SAVES */

const DB_NAME = "MaceonPlaySaves";
const DB_VERSION = 1;
const STORE_NAME = "saves";

/* SELEÇÃO DE TELA */

if (showCatalog) {
    catalog.style.display = "block";

} else if (selectedId === "001") {
    navigation.hidden = false;
    launcher.hidden = false;
    gameElement.hidden = false;

} else if (selectedId === "002") {
    navigation.hidden = false;
    leafLauncher.style.display = "block";
    gameElement.hidden = false;

} else if (selectedId === "003") {
    navigation.hidden = false;
    emeraldLauncher.style.display = "block";
    gameElement.hidden = false;

} else {
    catalog.style.display = "block";
}

/* INDEXEDDB */

function openSaveDatabase() {
    return new Promise(function(resolve, reject) {
        const request =
            indexedDB.open(DB_NAME, DB_VERSION);

        request.onupgradeneeded = function(event) {
            const db = event.target.result;

            if (!db.objectStoreNames.contains(STORE_NAME)) {
                db.createObjectStore(STORE_NAME);
            }
        };

        request.onsuccess = function() {
            resolve(request.result);
        };

        request.onerror = function() {
            reject(request.error);
        };
    });
}

/* ARMAZENAR SAVE */

async function storeSaveBuffer(buffer) {
    if (!selectedGame) return;

    const bytes = buffer instanceof Uint8Array
        ? buffer
        : new Uint8Array(buffer);

    const copy = bytes.slice();
    const db = await openSaveDatabase();

    return new Promise(function(resolve, reject) {
        const transaction =
            db.transaction(STORE_NAME, "readwrite");

        transaction.objectStore(STORE_NAME).put(
            {
                bytes: copy,
                size: copy.byteLength,
                savedAt: new Date().toISOString()
            },
            selectedGame.saveKey
        );

        transaction.oncomplete = function() {
            db.close();
            console.log(
                "Maceon Play: save armazenado.",
                selectedId,
                copy.byteLength,
                "bytes"
            );
            resolve();
        };

        transaction.onerror = function() {
            const error = transaction.error;
            db.close();
            reject(error);
        };
    });
}

/* RECUPERAR SAVE */

async function getStoredSave() {
    if (!selectedGame) return null;

    const db = await openSaveDatabase();

    return new Promise(function(resolve, reject) {
        const transaction =
            db.transaction(STORE_NAME, "readonly");

        const request = transaction
            .objectStore(STORE_NAME)
            .get(selectedGame.saveKey);

        request.onsuccess = function() {
            const result = request.result;
            db.close();
            resolve(result || null);
        };

        request.onerror = function() {
            const error = request.error;
            db.close();
            reject(error);
        };
    });
}

/* VERIFICAÇÃO DE ALTERAÇÕES NO SAVE */

function makeSaveSignature(bytes) {
    if (!bytes || !bytes.byteLength) return null;

    let hash = 2166136261;

    for (let i = 0; i < bytes.length; i += 64) {
        hash ^= bytes[i];
        hash = Math.imul(hash, 16777619);
    }

    return bytes.byteLength + ":" + (hash >>> 0);
}

/* ACESSO AO EMULADOR */

function getGameManager() {
    const emulator = window.EJS_emulator;

    if (!emulator || !emulator.gameManager) {
        return null;
    }

    return emulator.gameManager;
}

/* LER SAVE DO JOGO */

function readCurrentSRM() {
    try {
        const gameManager = getGameManager();

        if (
            !gameManager ||
            typeof gameManager.getSaveFile !== "function"
        ) {
            return null;
        }

        const save = gameManager.getSaveFile();

        if (!save || !save.byteLength) {
            return null;
        }

        return save instanceof Uint8Array
            ? save.slice()
            : new Uint8Array(save);

    } catch (error) {
        console.error(
            "Maceon Play: erro ao obter save.",
            error
        );
        return null;
    }
}

/* SALVAMENTO AUTOMÁTICO */

async function captureCurrentSRM(force = false) {
    if (!emulatorStarted) return false;

    try {
        const bytes = readCurrentSRM();
        if (!bytes) return false;

        const signature = makeSaveSignature(bytes);

        if (
            !force &&
            signature === lastAutomaticSaveSignature
        ) {
            return false;
        }

        await storeSaveBuffer(bytes);
        lastAutomaticSaveSignature = signature;

        console.log(
            "Maceon Play: save automático capturado.",
            selectedId,
            bytes.byteLength,
            "bytes"
        );

        return true;

    } catch (error) {
        console.error(
            "Maceon Play: erro no save automático.",
            error
        );
        return false;
    }
}

function startAutomaticSaveMonitor() {
    if (automaticSaveTimer) {
        clearInterval(automaticSaveTimer);
    }

    automaticSaveTimer = setInterval(function() {
        captureCurrentSRM(false);
    }, 7000);
}

/* RESTAURAR SAVE */

async function restoreStoredSave() {
    try {
        const stored = await getStoredSave();

        if (!stored || !stored.bytes) {
            console.log(
                "Maceon Play: nenhum save local encontrado."
            );
            return false;
        }

        const bytes = stored.bytes instanceof Uint8Array
            ? stored.bytes
            : new Uint8Array(stored.bytes);

        const timeout = Date.now() + 15000;

        while (Date.now() < timeout) {
            const gameManager = getGameManager();

            if (
                gameManager &&
                gameManager.FS &&
                typeof gameManager.getSaveFilePath === "function"
            ) {
                const FS = gameManager.FS;
                const savePath = gameManager.getSaveFilePath();

                if (!savePath) {
                    console.error(
                        "Maceon Play: caminho do save ausente."
                    );
                    return false;
                }

                const parts = savePath.split("/");
                let currentPath = "";

                for (
                    let i = 0;
                    i < parts.length - 1;
                    i++
                ) {
                    if (!parts[i]) continue;

                    currentPath += "/" + parts[i];

                    try {
                        if (!FS.analyzePath(currentPath).exists) {
                            FS.mkdir(currentPath);
                        }
                    } catch (error) {
                        try {
                            FS.mkdir(currentPath);
                        } catch (ignored) {}
                    }
                }

                try {
                    if (FS.analyzePath(savePath).exists) {
                        FS.unlink(savePath);
                    }
                } catch (ignored) {}

                FS.writeFile(savePath, bytes);

                try {
                    const check = FS.readFile(savePath);
                    console.log(
                        "Maceon Play: save escrito.",
                        check.byteLength,
                        "bytes"
                    );
                } catch (error) {
                    console.error(
                        "Maceon Play: falha ao conferir save.",
                        error
                    );
                }

                if (
                    typeof gameManager.loadSaveFiles !== "function"
                ) {
                    console.error(
                        "Maceon Play: loadSaveFiles indisponível."
                    );
                    return false;
                }

                const result = gameManager.loadSaveFiles();

                if (
                    result &&
                    typeof result.then === "function"
                ) {
                    await result;
                }

                lastAutomaticSaveSignature =
                    makeSaveSignature(bytes);

                console.log(
                    "Maceon Play: save restaurado.",
                    selectedId
                );

                return true;
            }

            await new Promise(function(resolve) {
                setTimeout(resolve, 100);
            });
        }

        console.error(
            "Maceon Play: gameManager indisponível."
        );
        return false;

    } catch (error) {
        console.error(
            "Maceon Play: erro na restauração.",
            error
        );
        return false;
    }
}

/* INICIAR EMULADOR */

function startEmulator(gameUrl) {
    if (emulatorStarted || !selectedGame || !gameUrl) {
        return;
    }

    emulatorStarted = true;

    playButton.disabled = true;
    leafPlayButton.disabled = true;
    emeraldPlayButton.disabled = true;

    message.textContent = "Carregando jogo...";

    launcher.style.display = "none";
    leafLauncher.style.display = "none";
    emeraldLauncher.style.display = "none";

    window.EJS_player = "#game";
    window.EJS_gameName = selectedGame.name;
    window.EJS_gameID = selectedGame.emulatorId;
    window.EJS_gameUrl = gameUrl;
    window.EJS_core = "gba";

    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/stable/data/";

    window.EJS_startOnLoaded = true;
    window.EJS_language = "pt-BR";
    window.EJS_fixedSaveInterval = 7000;

    /* SAVE MANUAL */

    window.EJS_onSaveSave = async function(event) {
        if (!event || !event.save) {
            console.error(
                "Maceon Play: emulador não forneceu save."
            );
            return;
        }

        try {
            const bytes = event.save instanceof Uint8Array
                ? event.save
                : new Uint8Array(event.save);

            await storeSaveBuffer(bytes);

            lastAutomaticSaveSignature =
                makeSaveSignature(bytes);

            console.log(
                "Maceon Play: save manual armazenado.",
                selectedId
            );

        } catch (error) {
            console.error(
                "Maceon Play: erro no save manual.",
                error
            );
        }
    };

    /* INÍCIO DO JOGO */

    window.EJS_onGameStart = async function() {
        console.log(
            "Maceon Play: jogo iniciado.",
            selectedId
        );

        await restoreStoredSave();
        startAutomaticSaveMonitor();
    };

    /* CARREGAR EMULATORJS */

    const loader = document.createElement("script");

    loader.src =
        "https://cdn.emulatorjs.org/stable/data/loader.js";

    loader.onerror = function() {
        emulatorStarted = false;

        if (selectedId === "001") {
            launcher.style.display = "block";
            message.textContent =
                "Não foi possível carregar o emulador.";
            message.classList.remove("sr-only");
            message.classList.add("load-error");
            playButton.disabled = false;

        } else if (selectedId === "002") {
            leafLauncher.style.display = "block";
            leafStatus.textContent =
                "Não foi possível carregar o emulador.";
            leafStatus.classList.remove("sr-only");
            leafStatus.classList.add("load-error");
            leafPlayButton.disabled = false;

        } else if (selectedId === "003") {
            emeraldLauncher.style.display = "block";
            emeraldStatus.textContent =
                "Não foi possível carregar o emulador.";
            emeraldStatus.classList.remove("sr-only");
            emeraldStatus.classList.add("load-error");
            emeraldPlayButton.disabled = false;
        }
    };

    document.body.appendChild(loader);
}

/* BOTÃO FIRE RED */

playButton.addEventListener("click", function() {
    if (selectedId === "001") {
        startEmulator(selectedGame.url);
    }
});

/* BOTÃO LEAF GREEN */

leafPlayButton.addEventListener("click", function() {
    if (selectedId === "002") {
        startEmulator(selectedGame.url);
    }
});

/* BOTÃO EMERALD ARENA */

emeraldPlayButton.addEventListener("click", function() {
    if (selectedId === "003") {
        startEmulator(selectedGame.url);
    }
});

/* SALVAR AO SAIR */

document.addEventListener("visibilitychange", function() {
    if (
        document.visibilityState === "hidden" &&
        emulatorStarted
    ) {
        captureCurrentSRM(true);
    }
});

</script>
</body>
</html>
