<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desafio de Ciências do Nicolas 🎯 | Quiz de Sustentação e Movimentação</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="[suspicious link removed]">
  <link rel="preconnect" href="[suspicious link removed]" crossorigin>
  <link href="[suspicious link removed]" rel="stylesheet">

  <style>
    :root {
      --primary: #4F46E5;
      --primary-dark: #3730A3;
      --secondary: #06B6D4;
      --accent: #EC4899;
      --success: #10B981;
      --error: #EF4444;
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-dark: #0F172A;
      --text-muted: #64748B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background-color: var(--bg);
      color: var(--text-dark);
      padding-bottom: 50px;
    }

    header {
      background: linear-gradient(135deg, #312E81 0%, #4F46E5 50%, #7C3AED 100%);
      color: white;
      padding: 35px 20px 45px;
      text-align: center;
      border-bottom-left-radius: 30px;
      border-bottom-right-radius: 30px;
      box-shadow: 0 10px 20px rgba(79, 70, 229, 0.2);
    }

    header h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: 2.2rem;
      margin-bottom: 8px;
    }

    header p {
      font-size: 1.1rem;
      opacity: 0.95;
    }

    .badge-student {
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      padding: 6px 16px;
      border-radius: 50px;
      font-weight: 800;
      font-size: 0.9rem;
      margin-bottom: 12px;
    }

    /* Scoreboard Stick Bar */
    .score-bar {
      max-width: 800px;
      margin: -20px auto 30px;
      background: white;
      padding: 15px 25px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 10;
    }

    .score-text {
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--primary);
    }

    .progress-container {
      width: 50%;
      background: #E2E8F0;
      height: 12px;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--secondary), var(--success));
      width: 0%;
      transition: width 0.3s ease;
    }

    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Card de Questão */
    .quiz-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      border: 1px solid #E2E8F0;
    }

    .question-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 15px;
    }

    .q-number {
      background: #EEF2FF;
      color: var(--primary);
      font-family: 'Fredoka', sans-serif;
      font-size: 1.1rem;
      padding: 6px 14px;
      border-radius: 12px;
      font-weight: 700;
    }

    .quiz-card h3 {
      font-size: 1.15rem;
      line-height: 1.5;
      color: var(--text-dark);
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }

    .option-btn {
      background: #F8FAFC;
      border: 2px solid #E2E8F0;
      padding: 14px 18px;
      border-radius: 14px;
      text-align: left;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-dark);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .option-btn:hover:not(:disabled) {
      background: #EEF2FF;
      border-color: var(--primary-light);
      transform: translateX(4px);
    }

    .option-btn.correct {
      background: #D1FAE5 !important;
      border-color: var(--success) !important;
      color: #065F46 !important;
    }

    .option-btn.wrong {
      background: #FEE2E2 !important;
      border-color: var(--error) !important;
      color: #991B1B !important;
    }

    .explanation-box {
      margin-top: 15px;
      padding: 14px 18px;
      border-radius: 12px;
      background: #F1F5F9;
      font-size: 0.95rem;
      font-weight: 600;
      display: none;
      border-left: 4px solid var(--primary);
    }

    /* Modal / Result Box */
    #result-card {
      display: none;
      background: white;
      text-align: center;
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      margin-top: 30px;
    }

    #result-card h2 {
      font-family: 'Fredoka', sans-serif;
      font-size: 2rem;
      color: var(--primary);
      margin-bottom: 10px;
    }

    .btn-restart {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 20px;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      color: var(--text-muted);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header>
    <div class="badge-student">🎯 QUIZ DE CIÊNCIAS 6º ANO</div>
    <h1>Desafio de Fixação: Nicolas no Esqueleto! 🦴</h1>
    <p>Responda às 20 questões e veja a sua nota em tempo real!</p>
  </header>

  <div class="score-bar">
    <div class="score-text" id="score-text">Pontuação: 0 / 20</div>
    <div class="progress-container">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>

  <main id="quiz-container"></main>

  <div id="result-card">
    <h2 id="result-title">🎉 Parabéns, Nicolas!</h2>
    <p id="result-desc" style="font-size: 1.2rem; font-weight: 700; margin: 15px 0;"></p>
    <button class="btn-restart" onclick="restartQuiz()">🔄 Refazer o Quiz</button>
  </div>

  <footer>
    <p>Desenvolvido para os estudos do Nicolas • Sustentação e Movimentação</p>
  </footer>

  <script>
    const questions = [
      {
        q: "1. O sistema esquelético humano desempenha papéis vitais. Além da sustentação e forma, qual outra função essencial é realizada pelos ossos planos (como os do crânio)?",
        options: [
          "(A) Produzir enzimas digestivas para quebrar alimentos.",
          "(B) Proteger órgãos internos sensíveis contra impactos mecânicos.",
          "(C) Filtrar as impurezas do ar antes dos pulmões.",
          "(D) Controlar os impulsos elétricos enviados ao cérebro.",
          "(E) Transportar gás oxigênio diretamente para a pele."
        ],
        ans: 1,
        exp: "Resposta correta: (B). Ossos planos (como os do crânio e costelas) protegem órgãos internos delicados contra choques mecânicos!"
      },
      {
        q: "2. Um bebê nasce com cerca de 300 ossos, mas um adulto tem 206. Por que isso acontece?",
        options: [
          "(A) Os ossos do bebê se desgastam e somem.",
          "(B) Conforme o corpo cresce, alguns ossos se fundem (se unem).",
          "(C) Os ossos menores caem na infância.",
          "(D) O cálcio faz o esqueleto encolher.",
          "(E) A medula amarela dissolve os ossos."
        ],
        ans: 1,
        exp: "Resposta correta: (B). Conforme a pessoa cresce, vários ossos pequenos se unem (fundem-se) formando ossos maiores."
      },
      {
        q: "3. Um osso com comprimento bem maior que a largura (como o fêmur e o úmero) é classificado como:",
        options: [
          "(A) Osso curto.",
          "(B) Osso plano.",
          "(C) Osso longo.",
          "(D) Osso irregular.",
          "(E) Osso articular."
        ],
        ans: 2,
        exp: "Resposta correta: (C). Ossos longos são aqueles em que o comprimento supera a largura e a espessura."
      },
      {
        q: "4. Qual a função dos Sais de Cálcio/Fosfato e do Colágeno nos ossos, respectivamente?",
        options: [
          "(A) Cálcio/Fosfato conferem dureza; Colágeno garante flexibilidade e absorção de choques.",
          "(B) Colágeno deixa o osso duro e Cálcio deixa o osso mole.",
          "(C) Água garante dureza e Gordura produz colágeno.",
          "(D) Cálcio dissolve o osso e colágeno bloqueia o sangue.",
          "(E) Periósteo substitui o cálcio nos exercícios."
        ],
        ans: 0,
        exp: "Resposta correta: (A). O cálcio e o fosfato dão rigidez e dureza, enquanto o colágeno impede que o osso seja quebradiço."
      },
      {
        q: "5. Qual a função principal da Medula Óssea Vermelha no interior dos ossos?",
        options: [
          "(A) Armazenar gordura de reserva.",
          "(B) Produzir os componentes do sangue (hemácias, leucócitos e plaquetas).",
          "(C) Lubrificar as articulações dos joelhos.",
          "(D) Transmitir impulsos nervosos.",
          "(E) Absorver raios X no hospital."
        ],
        ans: 1,
        exp: "Resposta correta: (B). A medula óssea vermelha é a 'fábrica' das células sanguíneas do nosso corpo!"
      },
      {
        q: "6. Como se chama a membrana que reveste a parte externa do osso e ajuda na nutrição e crescimento?",
        options: [
          "(A) Osteoblasto.",
          "(B) Periósteo.",
          "(C) Cartilagem articular.",
          "(D) Calo ósseo.",
          "(E) Tendão."
        ],
        ans: 1,
        exp: "Resposta correta: (B). O periósteo é repleto de vasos sanguíneos que nutrem e protegem os ossos."
      },
      {
        q: "7. Para que serve a 'moleira' (espaço membranoso) no crânio do recém-nascido?",
        options: [
          "(A) Bloquear a circulação sanguínea no cérebro.",
          "(B) Permitir a deformação no parto e dar espaço para o cérebro crescer.",
          "(C) Conectar as pernas ao crânio.",
          "(D) Guardar cálcio para os dentes.",
          "(E) Evitar a passagem de raio X."
        ],
        ans: 1,
        exp: "Resposta correta: (B). A moleira facilita a passagem do bebê no parto e dá flexibilidade para a cabeça crescer."
      },
      {
        q: "8. Quais células produzem matriz óssea para formar o calo ósseo e curar uma fratura?",
        options: [
          "(A) Leucócitos.",
          "(B) Osteoblastos.",
          "(C) Neurônios.",
          "(D) Plaquetas.",
          "(E) Miócitos."
        ],
        ans: 1,
        exp: "Resposta correta: (B). Os osteoblastos constroem novo tecido ósseo na recuperação de quebras."
      },
      {
        q: "9. Por que os ossos aparecem brancos (claros) na imagem de um exame de Raio X?",
        options: [
          "(A) Porque são mais densos e absorvem mais radiação do que a pele e músculos.",
          "(B) Porque refletem a luz da sala.",
          "(C) Porque são cobertos de gordura amarela.",
          "(D) Porque o aparelho só fotografa sangue.",
          "(E) Porque a cartilagem atrai eletricidade."
        ],
        ans: 0,
        exp: "Resposta correta: (A). Quanto mais denso o material (como o osso), mais clara é a imagem no Raio X!"
      },
      {
        q: "10. Quais ossos fazem parte exclusivamente do Esqueleto Axial (eixo central)?",
        options: [
          "(A) Fêmur, tíbia e fíbula.",
          "(B) Úmero, rádio e ulna.",
          "(C) Crânio, osso esterno, costelas e coluna vertebral.",
          "(D) Clavícula, escápula e quadril.",
          "(E) Tarsais e falanges."
        ],
        ans: 2,
        exp: "Resposta correta: (C). O Esqueleto Axial é formado pelo eixo central: crânio, tórax e coluna."
      },
      {
        q: "11. Um desvio lateral na coluna vertebral é denominado:",
        options: [
          "(A) Cifose.",
          "(B) Lordose.",
          "(C) Escoliose.",
          "(D) Osteoporiose.",
          "(E) Artrose."
        ],
        ans: 2,
        exp: "Resposta correta: (C). Escoliose é o desvio para os lados (lateral) na coluna."
      },
      {
        q: "12. Qual o peso máximo recomendado para a mochila escolar em relação ao peso do aluno?",
        options: [
          "(A) No máximo 10% da massa corporal.",
          "(B) Exatamente 50% da massa corporal.",
          "(C) No máximo 30% da massa corporal.",
          "(D) Qualquer peso.",
          "(E) O peso que conseguir erguer."
        ],
        ans: 0,
        exp: "Resposta correta: (A). A mochila deve pesar no máximo 10% da massa corporal para proteger a coluna."
      },
      {
        q: "13. Se ao caminhar o calcanhar se desloca para o lado EXTERNO, o tipo de pisada é:",
        options: [
          "(A) Pisada Normal.",
          "(B) Pisada Pronada.",
          "(C) Pisada Supinada.",
          "(D) Pisada Involuntária.",
          "(E) Pisada Articular."
        ],
        ans: 2,
        exp: "Resposta correta: (C). Pisada Supinada apoia mais a borda externa do pé."
      },
      {
        q: "14. Como são as contrações dos músculos do Coração e do Estômago/Intestino?",
        options: [
          "(A) Ambas voluntárias.",
          "(B) Cardíaco: rápida e involuntária / Estômago: lenta e involuntária.",
          "(C) Cardíaco: lenta e voluntária / Estômago: rápida e voluntária.",
          "(D) Ambas lentas.",
          "(E) Ambas rápidas e voluntárias."
        ],
        ans: 1,
        exp: "Resposta correta: (B). O coração tem contração rápida involuntária; os órgãos internos têm contração lenta involuntária."
      },
      {
        q: "15. Na flexão do antebraço (dobrar o braço), o que acontece com o bíceps e o tríceps?",
        options: [
          "(A) O bíceps se contrai puxando o rádio e o tríceps relaxa.",
          "(B) O bíceps relaxa e o tríceps contrai.",
          "(C) Ambos contraem juntos.",
          "(D) O tríceps puxa o rádio.",
          "(E) O bíceps solta o tendão."
        ],
        ans: 0,
        exp: "Resposta correta: (A). Músculos antagônicos: o bíceps se contrai e o tríceps relaxa para dobrar o braço."
      },
      {
        q: "16. As suturas do crânio de um adulto são classificadas como articulações:",
        options: [
          "(A) Móveis.",
          "(B) Semimóveis.",
          "(C) Imóveis.",
          "(D) Cartilaginosas livres.",
          "(E) Musculares."
        ],
        ans: 2,
        exp: "Resposta correta: (C). As suturas unem os ossos do crânio sem permitir movimentos."
      },
      {
        q: "17. Qual estrutura une os ossos entre si nas articulações móveis dando estabilidade?",
        options: [
          "(A) Tendão.",
          "(B) Ligamento.",
          "(C) Medula amarela.",
          "(D) Periósteo.",
          "(E) Neurônio."
        ],
        ans: 1,
        exp: "Resposta correta: (B). Ligamentos ligam osso a osso; Tendões ligam músculo a osso."
      },
      {
        q: "18. Por que os músculos tremem involuntariamente quando sentimos muito frio?",
        options: [
          "(A) Para esfriar o sangue.",
          "(B) Para produzir e gerar calor corporal.",
          "(C) Para eliminar cálcio.",
          "(D) Para quebrar os tendões.",
          "(E) Para soltar ar pelo estômago."
        ],
        ans: 1,
        exp: "Resposta correta: (B). A contração muscular libera energia térmica (calor) para manter o corpo aquecido."
      },
      {
        q: "19. Qual o papel do Sistema Cardiovascular durante o chute em uma bola?",
        options: [
          "(A) Criar os ossos da perna.",
          "(B) Mandar o sinal elétrico do cérebro.",
          "(C) Transportar oxigênio e nutrientes para os músculos gerarem energia.",
          "(D) Fabricar a cartilagem do joelho.",
          "(E) Travar os tendões."
        ],
        ans: 2,
        exp: "Resposta correta: (C). O sistema cardiovascular leva o 'combustível' (oxigênio e nutrientes) aos músculos."
      },
      {
        q: "20. Que adaptação óssea facilita o voo das aves deixando o esqueleto mais leve?",
        options: [
          "(A) Ossos porosos (pneumáticos).",
          "(B) Ausência total de cálcio.",
          "(C) Medula amarela pesada.",
          "(D) Músculos lisos no bico.",
          "(E) Coluna de borracha."
        ],
        ans: 0,
        exp: "Resposta correta: (A). Aves possuem ossos porosos (com cavidades cheias de ar), tornando o corpo leve para voar."
      }
    ];

    let currentScore = 0;
    let answeredCount = 0;

    function renderQuiz() {
      const container = document.getElementById('quiz-container');
      container.innerHTML = '';

      questions.forEach((q, index) => {
        const card = document.createElement('div');
        card.className = 'quiz-card';
        card.id = `q-card-${index}`;

        let optionsHTML = '';
        q.options.forEach((opt, optIdx) => {
          optionsHTML += `<button class="option-btn" onclick="checkAnswer(${index}, ${optIdx})">${opt}</button>`;
        });

        card.innerHTML = `
          <div class="question-header">
            <span class="q-number">Questão ${index + 1}</span>
          </div>
          <h3>${q.q}</h3>
          <div class="options-list">${optionsHTML}</div>
          <div class="explanation-box" id="exp-${index}">${q.exp}</div>
        `;

        container.appendChild(card);
      });
    }

    function checkAnswer(qIdx, optIdx) {
      const card = document.getElementById(`q-card-${qIdx}`);
      const buttons = card.querySelectorAll('.option-btn');
      const expBox = document.getElementById(`exp-${qIdx}`);
      const qData = questions[qIdx];

      // Disable buttons for this question
      buttons.forEach(btn => btn.disabled = true);

      if (optIdx === qData.ans) {
        buttons[optIdx].classList.add('correct');
        currentScore++;
      } else {
        buttons[optIdx].classList.add('wrong');
        buttons[qData.ans].classList.add('correct');
      }

      expBox.style.display = 'block';
      answeredCount++;

      // Update Score & Progress
      document.getElementById('score-text').innerText = `Pontuação: ${currentScore} / ${questions.length}`;
      let progressPercent = (answeredCount / questions.length) * 100;
      document.getElementById('progress-fill').style.width = progressPercent + '%';

      if (answeredCount === questions.length) {
        showFinalResult();
      }
    }

    function showFinalResult() {
      const resultCard = document.getElementById('result-card');
      const desc = document.getElementById('result-desc');
      resultCard.style.display = 'block';

      if (currentScore >= 18) {
        desc.innerText = `🏆 INCRÍVEL! Você acertou ${currentScore} de 20 questões! Nicolas, você está 100% preparado para gabaritar a prova! 🌟`;
      } else if (currentScore >= 12) {
        desc.innerText = `👍 Muito bem! Você acertou ${currentScore} de 20 questões! Dê mais uma lida no resumo para ficar afiado em tudo! 🔥`;
      } else {
        desc.innerText = `📚 Você acertou ${currentScore} de 20 questões. Não se preocupe! Revise os tópicos do resumo e tente novamente! 💪`;
      }

      resultCard.scrollIntoView({ behavior: 'smooth' });
    }

    function restartQuiz() {
      currentScore = 0;
      answeredCount = 0;
      document.getElementById('score-text').innerText = `Pontuação: 0 / 20`;
      document.getElementById('progress-fill').style.width = '0%';
      document.getElementById('result-card').style.display = 'none';
      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    renderQuiz();
  </script>
</body>
</html>
