<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quiz de Ciências — Nicolas</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17304d;background:#f2f6fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:850px;margin:auto;padding:20px}header{background:linear-gradient(115deg,#125a89,#137b89);color:white;padding:30px 20px;border-radius:18px;margin:15px 0 22px}h1{margin:0 0 8px;font-size:clamp(24px,5vw,34px)}header p{margin:0;line-height:1.5}.bar{background:#dce7f0;border-radius:30px;height:12px;overflow:hidden;margin:12px 0}.fill{height:100%;width:0;background:#24a37a;transition:width .2s}.card{background:white;border:1px solid #dbe5ef;border-radius:16px;padding:24px;margin:16px 0;box-shadow:0 3px 12px #17304d09}.eyebrow{color:#426987;font-size:14px;font-weight:700}.question{font-size:19px;line-height:1.65;white-space:pre-line;margin:14px 0 20px}.option{width:100%;display:flex;gap:14px;align-items:flex-start;text-align:left;background:#f8fbff;border:2px solid #dce6ef;border-radius:11px;padding:14px;margin:10px 0;color:#17304d;font:inherit;cursor:pointer;line-height:1.5}.option b{min-width:24px}.option:hover:not(:disabled){border-color:#147ca1;background:#eff9ff}.option:disabled{cursor:default;opacity:1}.option.correct{background:#d8f7e4;border-color:#198b51;color:#075b32}.option.wrong{background:#ffe1e1;border-color:#cf3e3e;color:#8d1f1f}.feedback{margin-top:18px;padding:16px;border-radius:12px;background:#eaf4fc;line-height:1.6}.feedback.good{background:#dcf7e7}.feedback.bad{background:#fff0e9}.btn{background:#125f90;color:white;border:0;border-radius:10px;padding:13px 20px;font:inherit;font-weight:700;cursor:pointer}.btn.secondary{background:#e4edf5;color:#174769}.btn:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;justify-content:space-between;gap:10px;margin:22px 0;flex-wrap:wrap}textarea{width:100%;min-height:150px;border:2px solid #dce6ef;border-radius:10px;padding:12px;font:inherit;resize:vertical}footer{text-align:center;color:#60768b;padding:25px} .small{font-size:14px;color:#526b82} .hidden{display:none} .question strong{font-weight:750} .result{font-size:23px;font-weight:750}</style></head><body><div class="wrap"><header><h1>🦴💪 Quiz de Ciências do Nicolas</h1><p>6º ano · Sustentação e movimentação do corpo humano · 35 questões objetivas e 5 discursivas</p></header><div class="card"><div id="progressLabel">Questão 1 de 40</div><div class="bar"><div class="fill" id="fill"></div></div><div class="small" id="score">Acertos: 0</div></div><main id="app"></main><div class="actions"><button class="btn secondary" id="prev">← Anterior</button><button class="btn" id="next">Próxima questão →</button></div><footer>Responda primeiro; o gabarito só aparece depois da resposta.</footer></div><script>
const questions=[{"n": 1, "head": "Questão 1. 🦴", "body": "Ao observar uma pessoa em pé, percebemos que o corpo humano possui uma forma definida e consegue se manter sustentado. Além disso, órgãos delicados como o cérebro e o coração estão protegidos.\n\n**Qual das alternativas descreve corretamente as funções do sistema esquelético?**", "options": ["Produzir hormônios para a digestão e digerir alimentos ricos em cálcio.", "Dar sustentação e forma ao corpo, auxiliar nos movimentos e proteger órgãos internos contra choques.", "Controlar os batimentos cardíacos de forma voluntária e bombear sangue para os músculos.", "Realizar a respiração celular diretamente nos ossos longos do corpo.", "Filtrar as toxinas do sangue através das cartilagens presentes nas orelhas."], "correct": "B"}, {"n": 2, "head": "Questão 2. 👶", "body": "Um bebê recém-nascido possui cerca de 300 ossos no corpo. Quando esse bebê crescer e se tornar um adulto, a quantidade de ossos será reduzida para cerca de 206.\n\n**Por que essa redução no número total de ossos acontece ao longo do desenvolvimento?**", "options": ["Porque os ossos vão se desgastando e desaparecendo com o passar dos anos.", "Porque a medula óssea absorve os ossos menores para produzir gordura.", "Porque alguns ossos se fundem (se unem) conforme o corpo se desenvolve.", "Porque os ossos dos braços e das pernas caem para dar lugar a ossos mais fortes.", "Porque o cálcio da alimentação faz os ossos diminuírem de tamanho."], "correct": "C"}, {"n": 3, "head": "Questão 3. 📏", "body": "Um cientista encontrou um osso em que a medida do comprimento era significativamente maior do que a sua largura e espessura. Exemplos desse tipo de osso são o fêmur e o úmero.\n\n**De acordo com a classificação quanto ao formato, como esse osso deve ser agrupado?**", "options": ["Osso plano.", "Osso curto.", "Osso irregular.", "Osso longo.", "Osso articular."], "correct": "D"}, {"n": 4, "head": "Questão 4. 🧱", "body": "Os ossos planos têm como característica marcante serem finos e fornecerem proteção a estruturas internas delicadas.\n\n**Assinale a alternativa que contém apenas exemplos de ossos planos:**", "options": ["Fêmur, tíbia e fíbula.", "Ossos carpais, tarsais e vértebras.", "Ossos do crânio, osso esterno, costelas e escápula.", "Rádio, ulna e falanges.", "Sacro, cóccix e fêmur."], "correct": "C"}, {"n": 5, "head": "Questão 5. 🔬", "body": "As vértebras que formam a coluna vertebral possuem formatos variados e complexos, não podendo ser classificadas como longas, curtas nem planas.\n\n**Qual é a classificação correta das vértebras quanto ao seu formato?**", "options": ["Ossos longos.", "Ossos curtos.", "Ossos planos.", "Ossos irregulares.", "Ossos sesamoides."], "correct": "D"}, {"n": 6, "head": "Questão 6. 🧪", "body": "O tecido ósseo é resistente e, ao mesmo tempo, flexível. Essa combinação de propriedades se deve aos seus componentes minerais e proteicos.\n\n**Qual alternativa relaciona corretamente cada componente à sua função no osso?**", "options": ["O cálcio garante flexibilidade e o colágeno garante a cor branca do osso.", "Os sais de cálcio e fosfato conferem dureza e resistência a fraturas, enquanto as fibras de colágeno garantem resistência contra choques e flexibilidade.", "A água garante a dureza do osso e a gordura da medula produz o colágeno.", "O fosfato faz o osso dobrar facilmente e o cálcio produz as hemácias.", "O periósteo garante que o osso seja transparente aos raios X."], "correct": "B"}, {"n": 7, "head": "Questão 7. 🩸", "body": "No interior dos ossos longos, como o fêmur, encontramos estruturas fundamentais para a reserva e produção de células.\n\n**Quais são os papéis da medula óssea amarela e da medula óssea vermelha, respectivamente?**", "options": ["A amarela produz sangue e a vermelha armazena cálcio.", "A amarela atua na reserva de gordura e a vermelha produz componentes sanguíneos (hemácias, leucócitos e plaquetas).", "A amarela é responsável pela contração muscular e a vermelha forma os tendões.", "Ambas têm a mesma função de revestir o osso por fora.", "A amarela produz colágeno e a vermelha absorve a água do corpo."], "correct": "B"}, {"n": 8, "head": "Questão 8. 🛡️", "body": "A membrana de tecido conjuntivo que reveste a parte externa do osso é chamada de periósteo.\n\n**Qual é a importância do periósteo para a saúde dos ossos?**", "options": ["Ele é responsável por articular os ossos com os músculos cardíacos.", "Ele contém vasos sanguíneos que auxiliam na proteção, nutrição e crescimento dos ossos.", "Ele impede que o osso absorva cálcio proveniente dos alimentos.", "Ele transforma ossos longos em ossos curtos durante a idade adulta.", "Ele substitui a medula óssea quando ocorre uma fratura."], "correct": "B"}, {"n": 9, "head": "Questão 9. 👶", "body": "Ao tocar suavemente a cabeça de um bebê recém-nascido, percebe-se uma região mais macia, conhecida popularmente como \"moleira\".\n\n**O que é cientificamente a moleira e qual a sua importância?**", "options": ["É uma lesão provocada durante o nascimento que necessita de cirurgia imediata.", "É um espaço membranoso entre os ossos do crânio que permite o crescimento da cabeça e facilita o parto, sendo posteriormente fechado pelo crescimento ósseo.", "É um acúmulo de gordura que protege o cérebro contra o frio.", "É um músculo involuntário que ajuda na mastigação do bebê.", "É uma articulação móvel que permanece aberta durante toda a vida adulta."], "correct": "B"}, {"n": 10, "head": "Questão 10. 🦴", "body": "A maior parte dos ossos do corpo humano começa a se formar no embrião a partir de moldes de um tecido mais flexível.\n\n**Que tecido é esse e onde ele ainda pode ser encontrado no corpo de um adulto?**", "options": ["Tecido muscular estriado; encontrado no coração e estômago.", "Tecido cartilaginoso (cartilagem); encontrado no nariz, orelhas, traqueia e extremidades dos ossos.", "Tecido epitelial; encontrado apenas nos dentes e unhas.", "Tecido nervoso; encontrado ao redor dos tendões e ligamentos.", "Tecido adiposo; encontrado exclusivamente no interior da medula amarela."], "correct": "B"}, {"n": 11, "head": "Questão 11. 🥛", "body": "O cálcio é um mineral indispensável para a manutenção de ossos e dentes fortes, além de atuar na contração muscular e na coagulação do sangue.\n\n**Assinale a alternativa que apresenta alimentos que são fontes importantes de cálcio:**", "options": ["Refrigerante, batata frita e doces industrializados.", "Leite e derivados, sardinha em conserva com espinhas, brócolis e couve.", "Arroz branco, pão francês e óleo de soja.", "Macarrão, café e manteiga de cacau.", "Açúcar refinado, sal de cozinha e margarina."], "correct": "B"}, {"n": 12, "head": "Questão 12. 🩺", "body": "Quando ocorre uma fratura óssea, o próprio organismo inicia um processo de reparo e regeneração.\n\n**Qual tipo de célula é responsável por produzir a nova matriz óssea para formar o calo ósseo na região lesionada?**", "options": ["Hemácias.", "Leucócitos.", "Osteoblastos.", "Plaquetas.", "Neurônios."], "correct": "C"}, {"n": 13, "head": "Questão 13. 🩻", "body": "Em 1895, o físico alemão Wilhelm Conrad Röntgen descobriu os raios X, que possibilitaram o desenvolvimento da radiografia.\n\n**Por que os ossos aparecem mais claros (brancos) em uma imagem de raio X em comparação com os músculos e a pele?**", "options": ["Porque os ossos contêm sangue que reflete a luz visível.", "Porque a pele e os músculos absorvem o ar da sala de exame.", "Porque os ossos absorvem mais raios X devido à sua composição mineral e maior capacidade de atenuação, aparecendo mais claros na imagem.", "Porque os músculos repelem as ondas elétricas emitidas pelo aparelho.", "Porque a radiografia só funciona em ossos fraturados."], "correct": "C"}, {"n": 14, "head": "Questão 14. 💡", "body": "Analise as afirmações sobre os discos intervertebrais, estruturas cartilaginosas presentes entre as vértebras da coluna vertebral.\n\nI. Amortecem os impactos causados por saltos e caminhadas.\n\nII. Ajudam a reduzir o atrito e a distribuir as cargas entre as vértebras.\n\nIII. Contêm fibras de colágeno.\n\n**Está(ão) correta(s):**", "options": ["Apenas a afirmação I.", "Apenas as afirmações I e II.", "Apenas as afirmações II e III.", "Nenhuma das afirmações.", "Todas as afirmações (I, II e III)."], "correct": "E"}, {"n": 15, "head": "Questão 15. 🧩", "body": "O esqueleto humano é dividido em duas partes principais: Esqueleto Axial e Esqueleto Apendicular.\n\n**Quais ossos fazem parte do Esqueleto Axial?**", "options": ["Fêmur, tíbia e fíbula.", "Úmero, rádio e ulna.", "Ossos do crânio, ossículos da orelha, costelas, osso esterno e vértebras.", "Clavícula, escápula e osso do quadril.", "Falanges da mão e falanges do pé."], "correct": "C"}, {"n": 16, "head": "Questão 16. 🫀", "body": "A caixa torácica é composta por ossos que protegem órgãos de importância vital para a sobrevivência.\n\n**Quais são os principais órgãos protegidos pelas costelas e pelo osso esterno?**", "options": ["Estômago e intestinos.", "Coração, pulmões e grandes vasos sanguíneos.", "Cérebro e cerebelo.", "Rins e bexiga urinária.", "Fígado e pâncreas."], "correct": "B"}, {"n": 17, "head": "Questão 17. 🎒", "body": "Durante a infância e a adolescência, o excesso de peso nas mochilas escolares pode sobrecarregar a coluna e causar dores.\n\n**Qual é o limite máximo frequentemente recomendado para a massa da mochila escolar em relação à massa corporal do aluno?**", "options": ["No máximo 50% da massa corporal.", "No máximo 30% da massa corporal.", "No máximo 10% da massa corporal.", "Não há limite, desde que a mochila seja de rodinhas.", "Exatamente 25% da massa corporal."], "correct": "C"}, {"n": 18, "head": "Questão 18. 🧘", "body": "A coluna vertebral possui quatro curvaturas naturais (cervical, torácica, lombar e sacral). Contudo, algumas alterações podem gerar desvios anatômicos.\n\n**Correlacione o desvio à sua característica:**\n\n1. Cifose acentuada (hipercifose)\n2. Lordose acentuada (hiperlordose)\n3. Escoliose\n\n(   ) Desvio lateral da coluna vertebral.\n\n(   ) Aumento da curvatura torácica, causando o arredondamento das costas (\"corcunda\").\n\n(   ) Aumento da curvatura lombar, criando uma depressão acentuada na parte inferior das costas.\n\n**A sequência correta é:**", "options": ["3, 1, 2.", "1, 2, 3.", "2, 3, 1.", "3, 2, 1.", "1, 3, 2."], "correct": "A"}, {"n": 19, "head": "Questão 19. 👟", "body": "Ao caminhar, os pés realizam uma sequência de movimentos combinados e sofrem grande pressão.\n\n**Uma pessoa cuja pisada apresenta uma tendência de apoiar o peso na borda externa do pé possui qual tipo de pisada?**", "options": ["Pisada normal.", "Pisada pronada.", "Pisada supinada.", "Pisada involuntária.", "Pisada plana."], "correct": "C"}, {"n": 20, "head": "Questão 20. 🦶", "body": "O pé humano é uma estrutura complexa formada por diversos ossos que garantem apoio e amortecimento.\n\n**Quais são os grupos de ossos presentes no pé indicados nos estudos de anatomia?**", "options": ["Carpais, metacarpais e falanges.", "Tarsais (incluindo o calcâneo), metatarsais e falanges.", "Úmero, rádio e ulna.", "Maxila, mandíbula e esterno.", "Cervical, torácico e sacral."], "correct": "B"}, {"n": 21, "head": "Questão 21. 💪", "body": "Os músculos são órgãos capazes de se contrair e relaxar, gerando movimento, mantendo a postura e produzindo calor.\n\n**Quantos e quais são os tipos de tecidos musculares presentes no corpo humano?**", "options": ["2 tipos: tecido muscular ósseo e tecido muscular gorduroso.", "3 tipos: estriado cardíaco, liso e estriado esquelético.", "4 tipos: voluntário, involuntário, cartilaginoso e ósseo.", "1 tipo: tecido muscular único de contração rápida.", "3 tipos: tecido conjuntivo, tecido epitelial e tecido nervoso."], "correct": "B"}, {"n": 22, "head": "Questão 22. 🫀", "body": "O coração é um órgão essencial para a circulação sanguínea que realiza contrações rítmicas continuamente.\n\n**Que tipo de tecido muscular forma a parede do coração e como é a sua contração?**", "options": ["Tecido muscular liso, com contração lenta e voluntária.", "Tecido muscular estriado esquelético, com contração rápida e voluntária.", "Tecido muscular estriado cardíaco, com contração rítmica e involuntária.", "Tecido muscular plano, sem capacidade de contração.", "Tecido muscular estriado esquelético, com contração lenta e involuntária."], "correct": "C"}, {"n": 23, "head": "Questão 23. 🍏", "body": "Os movimentos do estômago e dos intestinos para empurrar o alimento durante a digestão ocorrem sem que precisemos pensar neles.\n\n**Esses órgãos internos possuem em suas paredes qual tipo de tecido muscular?**", "options": ["Tecido muscular liso (contração geralmente lenta e involuntária).", "Tecido muscular estriado esquelético (contração rápida e voluntária).", "Tecido muscular estriado cardíaco (contração rápida e involuntária).", "Tecido ósseo esponjoso.", "Tecido cartilaginoso fibroso."], "correct": "A"}, {"n": 24, "head": "Questão 24. 🏋️‍♂️", "body": "Quando você decide chutar uma bola de futebol ou escrever no caderno, você está usando músculos associados aos ossos e articulações.\n\n**Como é caracterizada a contração do tecido muscular estriado esquelético?**", "options": ["Lenta e involuntária.", "Geralmente rápida e sob controle voluntário (depende da nossa vontade).", "Rápida e sempre involuntária.", "Ausente, pois o músculo não se contrai.", "Exclusivamente reflexa, sem controle do cérebro."], "correct": "B"}, {"n": 25, "head": "Questão 25. 😀", "body": "O corpo humano possui diversos músculos esqueléticos com funções bem específicas.\n\n**Assinale a alternativa que relaciona incorretamente o músculo à sua função:**", "options": ["Músculo orbicular da boca: responsável por estreitar a boca e franzir os lábios.", "Músculo deltoide: participa dos movimentos do braço para o lado, para a frente e para trás.", "Músculo glúteo máximo: estende o quadril, puxando a coxa para trás.", "Músculo gastrocnêmio: responsável por bombear o sangue do coração.", "Músculo oblíquo externo do abdome: participa da flexão e rotação do tronco."], "correct": "D"}, {"n": 26, "head": "Questão 26. ❄️", "body": "Em dias muito frios, é comum nosso corpo começar a tremer involuntariamente.\n\n**Por que a contração dos músculos esqueléticos ajuda nessa situação?**", "options": ["Porque a contração muscular consome gordura e esfria os órgãos internos.", "Porque a contração dos músculos estriados esqueléticos ajuda na geração de calor para manter a temperatura corporal.", "Porque tremer endurece os ossos contra o vento gelado.", "Porque a tremedeira desliga o sistema nervoso central.", "Porque os músculos lisos precisam soltar água para aquecer a pele."], "correct": "B"}, {"n": 27, "head": "Questão 27. 🔗", "body": "As articulações (ou juntas) são os pontos de encontro entre dois ou mais ossos. As suturas presentes no crânio de um adulto praticamente não permitem movimentos.\n\n**De acordo com a mobilidade, como as suturas são classificadas?**", "options": ["Articulações móveis.", "Articulações semimóveis.", "Articulações imóveis.", "Articulações cartilaginosas livres.", "Articulações musculares."], "correct": "C"}, {"n": 28, "head": "Questão 28. 🦵", "body": "As articulações do joelho e do quadril possuem cartilagem, um espaço com líquido lubrificante e feixes resistentes de tecido conjuntivo chamados ligamentos.\n\n**Qual a principal função dos ligamentos nas articulações móveis?**", "options": ["Produzir glóbulos vermelhos para as pernas.", "Manter os ossos unidos e conferir resistência e estabilidade à articulação.", "Conectar o cérebro aos músculos da coxa.", "Revestir a pele por fora dos joelhos.", "Quebrar os sais de cálcio para gerar energia."], "correct": "B"}, {"n": 29, "head": "Questão 29. 🦾", "body": "Durante o movimento de flexão do antebraço (dobrar o braço para cima), o músculo bíceps se contrai enquanto o tríceps relaxa.\n\n**O que acontece no movimento inverso de extensão do antebraço (esticar o braço)?**", "options": ["O bíceps continua contraído e o tríceps se contrai também.", "O bíceps relaxa e o tríceps se contrai, puxando a ulna através do tendão.", "Ambos os músculos relaxam e a gravidade solta o osso.", "O osso rádio se quebra para permitir o alinhamento.", "O tendão se solta do osso para aliviar a pressão."], "correct": "B"}, {"n": 30, "head": "Questão 30. 😬", "body": "Durante a mastigação, os músculos masseter e temporal atuam de forma coordenada para mover a mandíbula.\n\n**Como é chamada a ação em que dois ou mais músculos se contraem simultaneamente para realizar o mesmo movimento?**", "options": ["Ação antagônica.", "Ação sinérgica.", "Ação involuntária liso-cardíaca.", "Ação de alavanca imóvel.", "Ação de calo ósseo."], "correct": "B"}, {"n": 31, "head": "Questão 31. 🧠", "body": "Para que você consiga realizar um chute em uma partida de futebol, é necessária uma ação conjunta de diferentes sistemas do organismo.\n\n**Qual é a sequência correta de eventos comandada pelo corpo?**", "options": ["O músculo cria o sinal elétrico → o osso manda a ordem para o cérebro → o nervo relaxa.", "O encéfalo envia um impulso nervoso pela medula espinal e pelos nervos até o músculo → o músculo se contrai e traciona o tendão → o osso se move na articulação.", "O coração envia cálcio para o osso → o osso se contrai → o cérebro recebe a mensagem depois do movimento.", "A articulação gasta toda a gordura → o tendão vira músculo → o osso flexiona sozinho.", "O sistema digestório empurra o sangue → o ar faz o braço esticar."], "correct": "B"}, {"n": 32, "head": "Questão 32. 🫀", "body": "Além do sistema nervoso, muscular e esquelético, qual é o papel essencial do sistema cardiovascular na realização dos movimentos do corpo?", "options": ["Transportar gases (oxigênio) e nutrientes para as células musculares gerarem energia e remover resíduos.", "Substituir os tendões rompidos durante as corridas.", "Absorver o impacto entre os ossos do crânio.", "Guardar medula amarela nas veias das pernas.", "Produzir a cartilagem que reveste as costelas."], "correct": "A"}, {"n": 33, "head": "Questão 33. 🦅", "body": "Os animais vertebrados possuem esqueletos adaptados ao seu modo de vida e ambiente.\n\n**As aves conseguem voar com facilidade porque possuem asas e qual outra adaptação óssea importante?**", "options": ["Ossos totalmente maciços e pesados cheios de cálcio líquido.", "Muitos ossos pneumáticos, com cavidades preenchidas por ar, que ajudam a reduzir o peso do esqueleto.", "Ausência total de coluna vertebral.", "Músculos lisos nas extremidades das patas.", "Escamas ósseas ao redor da caixa torácica."], "correct": "B"}, {"n": 34, "head": "Questão 34. 🏃‍♂️", "body": "Os exercícios físicos podem ser classificados em aeróbios e anaeróbios.\n\n**Assinale a opção correta sobre os exercícios aeróbios:**", "options": ["Exigem pouquíssimo oxigênio e duram apenas alguns segundos (ex.: musculação pesada).", "Utilizam predominantemente o metabolismo aeróbio para produzir energia e podem ser realizados por períodos prolongados (ex.: caminhada, corrida e pedalada).", "São praticados exclusivamente dentro da água gelada.", "Provocam o desgaste irreversível de todos os ossos do corpo.", "Não trazem nenhum benefício ao sistema cardiovascular."], "correct": "B"}, {"n": 35, "head": "Questão 35. 🛡️", "body": "Para praticar atividades esportivas como andar de skate, patins ou bicicleta com segurança, é fundamental o uso de equipamentos de proteção.\n\n**Por que o uso de capacetes e joelheiras é recomendado?**", "options": ["Porque eles deixam o corpo mais pesado para correr rápido.", "Porque eles substituem o uso de calçados apropriados.", "Porque ajudam a proteger o corpo contra danos e lesões em quedas e impactos.", "Porque aumentam a quantidade de osteoblastos na pele.", "Porque transformam a pisada supinada em pisada normal automaticamente."], "correct": "C"}, {"n": 36, "head": "Questão 36 – Raciocínio Anatômico 🦴", "body": "Imaginemos que um cientista criou uma poção mágica que transformou todos os sais de cálcio e fosfato dos ossos de um atleta em fibras de colágeno puro.\n\n**Pergunta:** O que aconteceria com a capacidade desse atleta de se manter em pé e correr? Explique a diferença entre a função dos minerais (cálcio e fosfato) e a função do colágeno nos ossos.", "answer": "Os sais de cálcio e fosfato conferem dureza e rigidez aos ossos, enquanto o colágeno oferece resistência à tração e certa flexibilidade. Sem os minerais, os ossos perderiam grande parte da rigidez, prejudicando a sustentação do corpo e a capacidade de correr."}, {"n": 37, "head": "Questão 37 – Análise de Postura e Saúde 🎒", "body": "O Nicolas tem 12 anos e pesa 40 kg. Ao arrumar o seu material escolar, ele colocou tantos livros que sua mochila ficou pesando 9 kg.\n\n**Pergunta A:** De acordo com a recomendação de até 10% da massa corporal, a mochila do Nicolas está adequada ou com excesso de peso? Faça o cálculo do limite máximo recomendado.", "answer": "A) A mochila está acima do limite recomendado: 40 × 0,10 = 4 kg. A mochila pesa 9 kg, ou seja, 5 kg acima desse limite, correspondendo a 22,5% da massa corporal.\n\nB) O excesso de peso pode causar dor, fadiga muscular e alterações posturais. A escoliose é um desvio lateral da coluna; a hipercifose é o aumento da curvatura torácica; e a hiperlordose é o aumento da curvatura lombar. É importante distinguir essas alterações anatômicas dos efeitos da mochila: o excesso de peso pode provocar sobrecarga e posturas compensatórias, mas não é uma causa comprovada de desvios estruturais permanentes."}, {"n": 38, "head": "Questão 38 – Biomecânica e Músculos Antagônicos 🏋️", "body": "Quando o Nicolas dobra o cotovelo para levar um copo de água até a boca, seu braço realiza o movimento de flexão do antebraço.\n\n**Pergunta:** Explique detalhadamente a ação dos músculos bíceps e tríceps durante esse movimento, indicando qual músculo se contrai, qual relaxa e qual é a função do tendão nessa ação.", "answer": "Durante a flexão do cotovelo, o bíceps braquial se contrai, enquanto o tríceps reduz sua atividade para permitir o movimento. Os tendões conectam os músculos aos ossos e transmitem a força muscular, permitindo a movimentação do antebraço."}, {"n": 39, "head": "Questão 39 – Integração de Sistemas 🧠", "body": "Durante uma aula de Educação Física, o professor apita e o Nicolas sai correndo imediatamente para pegar a bola.\n\n**Pergunta:** Explique como o Sistema Nervoso, o Sistema Muscular, o Sistema Esquelético e o Sistema Cardiovascular trabalham de forma integrada para que o Nicolas consiga ouvir o apito e realizar a corrida.", "answer": "O sistema auditivo capta o apito e transmite a informação ao sistema nervoso, que interpreta o som e coordena os comandos motores. Os músculos recebem os impulsos nervosos e se contraem. Os ossos e as articulações funcionam como estruturas de sustentação e alavancas. O sistema cardiovascular transporta oxigênio e nutrientes para os músculos e ajuda a remover produtos do metabolismo."}, {"n": 40, "head": "Questão 40 – Adaptação Animal Comparada 🐸 🦅", "body": "Compare a estrutura do esqueleto e a locomoção do sapo com a de uma ave.\n\n**Pergunta:** Quais são as adaptações ósseas específicas encontradas nas pernas do sapo e no corpo da ave que permitem, respectivamente, o salto na terra e o voo no ar?", "answer": "Os sapos apresentam membros posteriores alongados, ossos adaptados à impulsão e musculatura desenvolvida para saltar. As aves apresentam membros anteriores modificados em asas, ossos pneumáticos em muitas espécies e estruturas esqueléticas adaptadas ao voo, como o esterno com quilha nas aves voadoras, que permite a fixação de músculos peitorais potentes."}];
const state=questions.map(()=>({choice:null,text:'',revealed:false}));let idx=0;
const app=document.getElementById('app');const letters=['A','B','C','D','E'];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmt(s){return esc(s).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');}
function render(){let q=questions[idx],st=state[idx];let answered=state.slice(0,35).filter(x=>x.choice!==null).length;let correct=questions.slice(0,35).filter((x,i)=>state[i].choice===x.correct).length;document.getElementById('progressLabel').textContent=`Questão ${idx+1} de 40 · ${answered}/35 objetivas respondidas`;document.getElementById('fill').style.width=((idx+1)/40*100)+'%';document.getElementById('score').textContent=`Acertos nas objetivas: ${correct} de ${answered}`;
let out=`<article class="card"><div class="eyebrow">${idx<35?'MÚLTIPLA ESCOLHA':'RESPOSTA ABERTA'} · QUESTÃO ${q.n}</div><h2>${esc(q.head)}</h2><div class="question">${fmt(q.body)}</div>`;
if(idx<35){out+=q.options.map((o,i)=>{let l=letters[i];let cls=st.choice===null?'':l===q.correct?' correct':l===st.choice?' wrong':'';return `<button class="option${cls}" data-choice="${l}" ${st.choice!==null?'disabled':''}><b>${l})</b><span>${esc(o)}</span></button>`}).join('');if(st.choice!==null){out+=`<div class="feedback ${st.choice===q.correct?'good':'bad'}"><strong>${st.choice===q.correct?'✅ Você acertou!':'❌ Você errou.'}</strong><div>Gabarito: <strong>${q.correct}) ${esc(q.options[letters.indexOf(q.correct)])}</strong></div></div>`;}}
else {out+=`<label for="response"><strong>Sua resposta:</strong></label><textarea id="response" placeholder="Escreva aqui sua resposta...">${esc(st.text)}</textarea><p><button class="btn" id="reveal" ${!st.text.trim()?'disabled':''}>Conferir gabarito</button></p>`;if(st.revealed)out+=`<div class="feedback"><strong>📘 Resposta sugerida (compare com a sua):</strong><p>${fmt(q.answer)}</p><span class="small">A resposta discursiva não é corrigida automaticamente.</span></div>`;}
out+='</article>';app.innerHTML=out;
app.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{if(state[idx].choice!==null)return;state[idx].choice=b.dataset.choice;render();}));let ta=document.getElementById('response');if(ta)ta.addEventListener('input',e=>{state[idx].text=e.target.value;document.getElementById('reveal').disabled=!e.target.value.trim()});let rev=document.getElementById('reveal');if(rev)rev.addEventListener('click',()=>{state[idx].revealed=true;render()});document.getElementById('prev').disabled=idx===0;document.getElementById('next').textContent=idx===39?'Ver resultado final →':'Próxima questão →';window.scrollTo({top:0,behavior:'instant'});}
function results(){let a=questions.slice(0,35).filter((q,i)=>state[i].choice===q.correct).length;let done=state.slice(0,35).filter(x=>x.choice!==null).length;app.innerHTML=`<section class="card"><h2>🏆 Resultado do Nicolas</h2><p class="result">${a} acertos em ${done} questões objetivas respondidas</p><p>${done===35?'Você concluiu todas as questões objetivas!':'Ainda faltam '+(35-done)+' questões objetivas.'}</p><p>As 5 questões discursivas podem ser conferidas individualmente com as respostas sugeridas.</p><button class="btn" id="back">Voltar ao quiz</button></section>`;document.getElementById('back').onclick=render;}
document.getElementById('prev').onclick=()=>{if(idx>0){idx--;render()}};document.getElementById('next').onclick=()=>{if(idx<39){idx++;render()}else results()};render();
</script></body></html>
