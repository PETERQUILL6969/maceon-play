const DATA={"intro": ["🦴💪 GUIA COMPLETO DE CIÊNCIAS PARA O NICOLAS: SUSTENTAÇÃO E MOVIMENTAÇÃO DO CORPO HUMANO 🚀", "Olá, Nicolas! 👋 Preparamos este resumo super detalhado, organizado e cheio de explicações para você entender tudo sobre como o seu corpo se sustenta, corre, pula e faz todos os movimentos do dia a dia! 📚✨"], "sections": [{"title": "1. 🦴 O Sistema Esquelético (O Seu Esqueleto!)", "lines": ["O sistema esquelético é formado por ossos e cartilagens. Ele é responsável por dar sustentação e forma ao corpo, nos ajudar a ficar em pé, andar e realizar movimentos, além de proteger órgãos internos contra fortes impactos.", "Quantos ossos temos no corpo? 🤔", "Ao nascer, um bebê tem cerca de 300 ossos.", "Conforme a pessoa cresce e se desenvolve até a fase adulta, alguns ossos se fundem (se unem), reduzindo o total para 206 ossos.", "Classificação dos ossos pelo formato: 📏", "Ossos longos: têm o comprimento maior do que a largura. Exemplos: fêmur, úmero, rádio, ulna, tíbia, fíbula e falanges.", "Ossos curtos: têm o comprimento e a largura bem parecidos. Exemplos: ossos carpais (mão) e tarsais (pé).", "Ossos planos: são finos e servem principalmente para proteção. Exemplos: ossos do crânio, osso esterno, costelas e escápula.", "Ossos irregulares: possuem formatos variados que não se encaixam nas outras categorias. Exemplo: vértebras da coluna.", "Do que o osso é feito por dentro? 🔬", "Sais de cálcio e fosfato: garantem a dureza dos ossos e a resistência contra fraturas.", "Fibras de colágeno: oferecem flexibilidade e resistência contra choques e pressões.", "Cavidade medular: fica no centro dos ossos longos e abriga a medula óssea amarela (reserva de gordura).", "Medula óssea vermelha: produz as células do sangue (hemácias, leucócitos e plaquetas).", "Periósteo: membrana que reveste o osso por fora, contendo vasos sanguíneos que ajudam na proteção, nutrição e crescimento do osso.", "Como o esqueleto é dividido? 🧩", "Esqueleto Axial (Eixo central): sustenta o corpo e protege órgãos vitais. Inclui os ossos do crânio, osso esterno, costelas e a coluna vertebral.", "Crânio: protege o encéfalo e forma o rosto (maxila e mandíbula ajudam na mastigação).", "Caixa torácica (Costelas e Esterno): protege o coração e os pulmões.", "Coluna vertebral: protege a medula espinal e sustenta a cabeça.", "Esqueleto Apendicular (Membros): formado pelos ossos dos braços (membros superiores) e das pernas (membros inferiores), além das estruturas que os unem ao tronco (clavícula, escápula e osso do quadril)."]}, {"title": "2. 🦴 Formação, Crescimento e Regeneração dos Ossos", "lines": ["Moleira no bebê: Os ossos do crânio do recém-nascido não estão totalmente unidos; o espaço membranoso entre eles é chamado popularmente de moleira, que depois é substituído por osso duro.", "Cartilagem: Tecido flexível formado por colágeno. Serve de molde para a formação de muitos ossos no embrião e está presente no nariz, orelhas, traqueia e nas extremidades dos ossos. Entre as vértebras da coluna, a cartilagem amortece os impactos e serve como lubrificante para evitar o desgaste ósseo.", "Alimentação e Cálcio: 🥛🥦 Alimentos ricos em cálcio (como leite, queijo, peixes, brócolis e couve) são essenciais para manter os ossos e dentes fortes.", "Regeneração de Fraturas: Células chamadas osteoblastos produzem a matriz óssea. Quando um osso quebra, o corpo produz um novo tecido formando o calo ósseo, regenerando a fratura.", "Radiografia (Raio X): 🩻 Criada em 1895 por Wilhelm Röntgen, essa tecnologia permite aos médicos visualizar a parte interna do corpo e identificar fraturas, pois os ossos (por serem densos) aparecem mais claros na imagem."]}, {"title": "3. 🧘 Saúde da Coluna Vertebral e dos PÉS", "lines": ["Curvaturas e Desvios da Coluna: A coluna possui curvaturas naturais (cervical, torácica, lombar e sacral). A má postura pode gerar desvios:", "Cifose: desvio na curvatura torácica que deixa as costas arredondadas (\"corcunda\").", "Lordose: desvio na curvatura lombar que acentua a curva para dentro.", "Escoliose: desvio para os lados (lateral) na coluna.", "A Regra da Mochila: 🎒 Para evitar problemas de coluna na infância e adolescência, a mochila escolar deve pesar no máximo 10% da sua massa corporal!", "A Pisada dos Pés: 👟 Durante a caminhada, os pés passam pelas etapas de contato do calcanhar, apoio médio, impulsão e aceleração. A pisada pode ser normal (alinhada), supinada (inclinada para fora) ou pronada (inclinada para dentro)."]}, {"title": "4. 🏋️ O Sistema Muscular (A Força do Movimento!)", "lines": ["Os músculos são formados por tecidos capazes de se contrair e distender, sendo responsáveis pelos movimentos, manutenção da postura e geração de calor.", "Os 3 Tipos de Tecido Muscular: 🧠", "Estriado Esquelético: está ligado aos ossos e articulações; sua contração é rápida e voluntária (depende da nossa vontade, como quando você dobra o braço).", "Estriado Cardíaco: forma o coração; sua contração é rápida e involuntária (trabalha sozinho sem você precisar pensar).", "Liso: presente nos órgãos internos (estômago, intestinos, bexiga e vasos sanguíneos); sua contração é lenta e involuntária.", "Como os Músculos Trabalham Juntos? 🤼‍♂️", "Músculos Antagônicos (Ação Inversa): Ao flexionar o antebraço, o bíceps se contrai e o tríceps relaxa. Ao esticar o braço, acontece o oposto: o tríceps se contrai e o bíceps relaxa.", "Músculos Sinérgicos (Ação Conjunta): Atuam juntos ao mesmo tempo, como os músculos masseter e temporal que se contraem juntos durante a mastigação."]}, {"title": "5. 🔗 Articulações e Tendões (As \"Dobradiças\" do Corpo)", "lines": ["Articulações (Juntas): São os pontos de encontro entre dois ou mais ossos. Classificam-se em:", "Imóveis: não permitem movimento (ex.: suturas do crânio).", "Semimóveis: permitem pequenos movimentos amortecidos por cartilagem (ex.: articulações entre as vértebras).", "Móveis: garantem grande mobilidade, possuem um líquido lubrificante e são sustentadas por ligamentos (ex.: joelho, cotovelo, quadril).", "Tendões: São cordões resistentes de tecido que prendem os músculos aos ossos, transmitindo a força da contração para puxar o osso."]}, {"title": "6. ⚡ A Grande Integração dos Sistemas!", "lines": ["Nenhum movimento do corpo acontece de forma isolada! Para praticar capoeira, correr ou jogar bola, quatro sistemas atuam juntos:", "🧠 Sistema Nervoso: envia impulsos elétricos do encéfalo e medula espinal através dos nervos até o músculo.", "💪 Sistema Muscular: recebe o sinal e se contrai, puxando os tendões.", "🦴 Sistema Esquelético: o osso é puxado e gira na articulação, gerando o movimento.", "🫀 Sistema Cardiovascular: o sangue transporta oxigênio e nutrientes para as células musculares gerarem energia para a contração."]}, {"title": "7. 🐸 Sustentação e Movimentação em Outros Animais", "lines": ["Todos os animais vertebrados possuem coluna vertebral originada da notocorda na fase embrionária:", "Sapos: têm pernas traseiras adaptadas para dar grandes saltos na terra.", "Aves: possuem asas e ossos porosos (mais leves) que facilitam a locomoção no ar durante o voo.", "Peixes: têm corpo hidrodinâmico e nadadeiras preparadas para a natação."]}, {"title": "8. 🚴 Atividades Físicas e Cuidados com a Saúde", "lines": ["Praticar exercícios regularmente traz inúmeros benefícios: melhora o sono, fortalece o coração, queima gordura corporal, aumenta a massa muscular e melhora a autoestima!", "Exercícios Aeróbios: intensidade média e longa duração, exigindo mais oxigênio (ex.: caminhada, corrida, andar de bicicleta).", "Exercícios Anaeróbios: alta intensidade e curta duração (ex.: musculação).", "Dicas de Segurança: Fazer alongamentos e aquecimento antes dos treinos previne lesões. Além disso, use sempre equipamentos de proteção como capacetes e joelheiras ao andar de skate ou bicicleta!"]}], "questions": [{"n": 1, "stem": "🦴 Ao observar uma pessoa em pé, percebemos que o corpo humano possui uma forma definida e consegue se manter sustentado. Além disso, órgãos delicados como o cérebro e o coração estão protegidos. Qual das alternativas descreve corretamente as funções do sistema esquelético?", "choices": ["Produzir hormônios para a digestão e digerir alimentos ricos em cálcio.", "Dar sustentação e forma ao corpo, auxiliar nos movimentos e proteger órgãos internos contra choques.", "Controlar os batimentos cardíacos de forma voluntária e bombear sangue para os músculos.", "Realizar a respiração celular diretamente nos ossos longos do corpo.", "Filtrar as toxinas do sangue através das cartilagens presentes nas orelhas."], "correct": 1, "explanation": "Sustentação, forma, movimento e proteção"}, {"n": 2, "stem": "👶 Um bebê recém-nascido possui cerca de 300 ossos no corpo. Quando esse bebê crescer e se tornar um adulto, a quantidade de ossos será reduzida para cerca de 206. Por que essa redução no número total de ossos acontece ao longo do desenvolvimento?", "choices": ["Porque os ossos vão se desgastando e desaparecendo com o passar dos anos.", "Porque a medula óssea absorve os ossos menores para produzir gordura.", "Porque alguns ossos se fundem (se unem) conforme o corpo se desenvolve.", "Porque os ossos dos braços e das pernas caem para dar lugar a ossos mais fortes.", "Porque o cálcio da alimentação faz os ossos diminuírem de tamanho."], "correct": 2, "explanation": "Fusão de ossos ao longo do crescimento"}, {"n": 3, "stem": "📏 Um cientista encontrou um osso em que a medida do comprimento era significativamente maior do que a sua largura e espessura. Exemplos desse tipo de osso são o fêmur e o úmero. De acordo com a classificação quanto ao formato, como esse osso deve ser agrupado?", "choices": ["Osso plano.", "Osso curto.", "Osso irregular.", "Osso longo.", "Osso articular."], "correct": 3, "explanation": "Osso longo (comprimento maior que largura)"}, {"n": 4, "stem": "🧱 Os ossos planos têm como característica marcante serem finos e fornecerem proteção a estruturas internas delicadas. Assinale a alternativa que contém apenas exemplos de ossos planos:", "choices": ["Fêmur, tíbia e fíbula.", "Ossos carpais, tarsais e vértebras.", "Ossos do crânio, osso esterno, costelas e escápula.", "Rádio, ulna e falanges.", "Sacro, cóccix e fêmur."], "correct": 2, "explanation": "Crânio, esterno, costelas e escápula"}, {"n": 5, "stem": "🔬 As vértebras que formam a coluna vertebral possuem formatos variados e complexos, não podendo ser classificadas como longas, curtas nem planas. Qual é a classificação correta das vértebras quanto ao seu formato?", "choices": ["Ossos longos.", "Ossos curtos.", "Ossos planos.", "Ossos irregulares.", "Ossos sesamóides."], "correct": 3, "explanation": "Ossos irregulares"}, {"n": 6, "stem": "🧪 O tecido ósseo é resistente e ao mesmo tempo flexível. Essa combinação de propriedades se deve aos seus componentes minerais e proteicos. Qual alternativa relaciona corretamente cada componente à sua função no osso?", "choices": ["O cálcio garante flexibilidade e o colágeno garante a cor branca do osso.", "Os sais de cálcio e fosfato conferem dureza e resistência a fraturas, enquanto as fibras de colágeno garantem resistência contra choques e flexibilidade.", "A água garante a dureza do osso e a gordura da medula produz a colágeno.", "O fosfato faz o osso dobrar facilmente e o cálcio produz as hemácias.", "O periósteo garante que o osso seja transparente aos raios X."], "correct": 1, "explanation": "Cálcio/fosfato conferem dureza; colágeno confere flexibilidade"}, {"n": 7, "stem": "🩸 No interior dos ossos longos, como o fêmur, encontramos estruturas fundamentais para a reserva e produção de células. Quais são os papéis da medula óssea amarela e da medula óssea vermelha, respectivamente?", "choices": ["A amarela produz sangue e a vermelha armazena cálcio.", "A amarela atua na reserva de gordura e a vermelha produz componentes sanguíneos (hemácias, leucócitos e plaquetas).", "A amarela é responsável pela contração muscular e a vermelha forma os tendões.", "Ambas têm a mesma função de revestir o osso por fora.", "A amarela produz colágeno e a vermelha absorve a água do corpo."], "correct": 1, "explanation": "Amarela = gordura; Vermelha = células do sangue"}, {"n": 8, "stem": "🛡️ A membrana de tecido conjuntivo que reveste a parte externa do osso é chamada de periósteo. Qual é a importância do periósteo para a saúde dos ossos?", "choices": ["Ele é responsável por articular os ossos com os músculos cardíacos.", "Ele contém vasos sanguíneos que auxiliam na proteção, nutrição e crescimento dos ossos.", "Ele impede que o osso absorva cálcio proveniente dos alimentos.", "Ele transforma ossos longos em ossos curtos durante a idade adulta.", "Ele substitui a medula óssea quando ocorre uma fratura."], "correct": 1, "explanation": "Vaso sanguíneo, nutrição e crescimento no periósteo"}, {"n": 9, "stem": "👶 Ao tocar suavemente a cabeça de um bebê recém-nascido, percebe-se uma região mais macia, conhecida popularmente como \"moleira\". O que é cientificamente a moleira e qual a sua importância?", "choices": ["É uma lesão provocada durante o nascimento que necessita de cirurgia imediata.", "É um espaço membranoso entre os ossos do crânio que permite o crescimento da cabeça e facilita o parto, sendo depois substituído por osso duro.", "É um acúmulo de gordura que protege o cérebro contra o frio.", "É um músculo involuntário que ajuda na mastigação do bebê.", "É uma articulação móvel que permanece aberta durante toda a vida adulta."], "correct": 1, "explanation": "Espaço membranoso (moleira) para crescimento e parto"}, {"n": 10, "stem": "🦴 A maior parte dos ossos do corpo humano começa a se formar no embrião a partir de moldes de um tecido mais flexível. Que tecido é esse e onde ele ainda pode ser encontrado no corpo de um adulto?", "choices": ["Tecido muscular estriado; encontrado no coração e estômago.", "Tecido cartilaginoso (cartilagem); encontrado no nariz, orelhas, traqueia e extremidades dos ossos.", "Tecido epitelial; encontrado apenas nos dentes e unhas.", "Tecido nervoso; encontrado ao redor dos tendões e ligamentos.", "Tecido adiposo; encontrado exclusivamente no interior da medula amarela."], "correct": 1, "explanation": "Cartilagem (nariz, orelhas, extremidades ósseas)"}, {"n": 11, "stem": "🥛 O cálcio é um mineral indispensável para a manutenção de ossos e dentes fortes, além de atuar na contração muscular e na coagulação do sangue. Assinale a alternativa que apresenta apenas alimentos ricos em cálcio recomendados para a dieta:", "choices": ["Refrigerante, batata frita e doces industrializados.", "Leite e derivados, sardinha em conserva, peixes, brócolis e couve.", "Arroz branco, pão francês e óleo de soja.", "Macarrão, café e manteiga de cacau.", "Açúcar refinado, sal de cozinha e margarina."], "correct": 1, "explanation": "Leite, derivados, sardinha, peixes, brócolis e couve"}, {"n": 12, "stem": "🩺 Quando ocorre uma fratura óssea, o próprio organismo inicia um processo de reparo e regeneração. Qual tipo de célula é responsável por produzir a nova matriz óssea para formar o calo ósseo na região lesionada?", "choices": ["Hemácias.", "Leucócitos.", "Osteoblastos.", "Plaquetas.", "Neurônios."], "correct": 2, "explanation": "Osteoblastos produzem a matriz óssea do calo ósseo"}, {"n": 13, "stem": "🩻 Em 1895, o físico alemão Wilhelm Conrad Röntgen descobriu a técnica da radiografia (Raio X). Por que os ossos aparecem mais claros (brancos) em uma imagem de Raio X em comparação com os músculos e a pele?", "choices": ["Porque os ossos contêm sangue que reflete a luz visível.", "Porque a pele e os músculos absorvem o ar da sala de exame.", "Porque quanto mais denso é o material (como o osso), mais clara é a imagem registrada no anteparo.", "Porque os músculos repelem as ondas elétricas emitidas pelo aparelho.", "Porque a radiografia só funciona em ossos fraturados."], "correct": 2, "explanation": "Quanto mais denso o material, mais claro no Raio X"}, {"n": 14, "stem": "💡 Analise as afirmacoes sobre a cartilagem presente entre as vértebras da coluna vertebral: I. Amortece os impactos causados por saltos e caminhadas. II. Serve como lubrificante evitando o desgaste entre os ossos. III. É formada por fibras de colágeno. Está(ão) correta(s):", "choices": ["Apenas a afirmação I.", "Apenas as afirmações I e II.", "Apenas as afirmações II e III.", "Nenhuma das afirmações.", "Todas as afirmações (I, II e III)."], "correct": 4, "explanation": "Todas as afirmações estão corretas"}, {"n": 15, "stem": "🧩 O esqueleto humano é dividido em duas partes principais: Esqueleto Axial e Esqueleto Apendicular. Quais ossos fazem parte do Esqueleto Axial?", "choices": ["Fêmur, tíbia e fíbula.", "Úmero, rádio e ulna.", "Ossos do crânio, ossículos da orelha, costelas, osso esterno e vértebras.", "Clavícula, escápula e osso do quadril.", "Falanges da mão e falanges do pé."], "correct": 2, "explanation": "Crânio, orelha, costelas, esterno e vértebras"}, {"n": 16, "stem": "🫀 A caixa torácica é composta por ossos que protegem órgãos de importância vital para a sobrevivência. Quais são os principais órgãos protegidos pelas costelas e pelo osso esterno?", "choices": ["Estômago e intestinos.", "Coração, pulmões e grandes vasos sanguíneos.", "Cérebro e cerebelo.", "Rins e bexiga urinária.", "Fígado e pâncreas."], "correct": 1, "explanation": "Coração, pulmões e grandes vasos"}, {"n": 17, "stem": "🎒 Durante a infância e a adolescência, o excesso de peso nas mochilas escolares pode sobrecarregar a coluna e causar dores crônicas. Qual é o limite máximo recomendado para a massa da mochila escolar em relação à massa corporal do aluno?", "choices": ["No máximo 50% da massa corporal.", "No máximo 30% da massa corporal.", "No máximo 10% da massa corporal.", "Não há limite, desde que a mochila seja de rodinhas.", "Exatamente 25% da massa corporal."], "correct": 2, "explanation": "No máximo 10% da massa corporal"}, {"n": 18, "stem": "🧘 A coluna vertebral possui quatro curvaturas naturais (cervical, torácica, lombar e sacral). Contudo, hábitos de postura inadequados podem gerar desvios anatômicos. Correlacione o desvio à sua característica:\nCifose\nLordose\nEscoliose (   ) Desvio lateral da coluna vertebral. (   ) Aumento da curvatura torácica, causando o arredondamento das costas (\"corcunda\"). (   ) Aumento da curvatura lombar, criando uma depressão acentuada na parte inferior das costas. A sequência correta é:", "choices": ["3, 1, 2.", "1, 2, 3.", "2, 3, 1.", "3, 2, 1.", "1, 3, 2."], "correct": 0, "explanation": "Sequência 3 (Escoliose), 1 (Cifose), 2 (Lordose)"}, {"n": 19, "stem": "👟 Ao caminhar, os pés realizam uma sequência de movimentos combinados e sofrem grande pressão. Uma pessoa cuja pisada faz com que o osso do calcanhar se desloque para o lado externo possui qual tipo de pisada?", "choices": ["Pisada Normal.", "Pisada Pronada.", "Pisada Supinada.", "Pisada Involuntária.", "Pisada Plana."], "correct": 2, "explanation": "Pisada supinada (deslocamento para o lado externo)"}, {"n": 20, "stem": "🦶 O pé humano é uma estrutura complexa formada por diversos ossos que garantem apoio e amortecimento. Quais são os grupos de ossos presentes no pé indicados nas anatomias de estudo?", "choices": ["Carpais, metacarpais e falanges.", "Tarsais, metatarsais, falanges e calcâneo.", "Úmero, rádio e ulna.", "Maxila, mandíbula e esterno.", "Cervical, torácico e sacral."], "correct": 1, "explanation": "Tarsais, metatarsais, falanges e calcâneo"}, {"n": 21, "stem": "💪 Os músculos são órgãos capazes de se contrair e distender, gerando movimento, mantendo a postura e produzindo calor. Quantos e quais são os tipos de tecidos musculares presentes no corpo humano?", "choices": ["2 tipos: tecido muscular ósseo e tecido muscular gorduroso.", "3 tipos: estriado cardíaco, liso e estriado esquelético.", "4 tipos: voluntário, involuntário, cartilaginoso e ósseo.", "1 tipo: tecido muscular único de contração rápida.", "3 tipos: tecido conjuntivo, tecido epitelial e tecido nervoso."], "correct": 1, "explanation": "Cardíaco, liso e estriado esquelético"}, {"n": 22, "stem": "🫀 O coração é um órgão essencial para a circulação sanguínea que não para de bater um segundo sequer. Que tipo de tecido muscular forma a parede do coração e como é a sua contração?", "choices": ["Tecido muscular liso, com contração lenta e voluntária.", "Tecido muscular estriado esquelético, com contração rápida e voluntária.", "Tecido muscular estriado cardíaco, com contração rápida e involuntária.", "Tecido muscular plano, sem capacidade de contração.", "Tecido muscular estriado esquelético, com contração lenta e involuntária."], "correct": 2, "explanation": "Estriado cardíaco (contração rápida e involuntária)"}, {"n": 23, "stem": "🍏 Os movimentos do estômago e dos intestinos para empurrar o alimento durante a digestão ocorrem sem que precisemos pensar neles. Esses órgãos internos são revestidos por qual tipo de tecido muscular?", "choices": ["Tecido muscular liso (contração lenta e involuntária).", "Tecido muscular estriado esquelético (contração rápida e voluntária).", "Tecido muscular estriado cardíaco (contração rápida e involuntária).", "Tecido ósseo esponjoso.", "Tecido cartilaginoso fibroso."], "correct": 0, "explanation": "Liso (contração lenta e involuntária nos órgãos)"}, {"n": 24, "stem": "🏋️‍♂️ Quando você decide chutar uma bola de futebol ou escrever no caderno, você está usando músculos associados aos ossos e articulações. Como é caracterizada a contração do tecido muscular estriado esquelético?", "choices": ["Lenta e involuntária.", "Rápida e voluntária (depende da nossa vontade).", "Rápida e involuntária.", "Ausente, pois o músculo não se contrai.", "Exclusivamente reflexa, sem controle do cérebro."], "correct": 1, "explanation": "Rápida e voluntária"}, {"n": 25, "stem": "😀 O corpo humano possui diversos músculos esqueléticos com funções bem específicas. Assinale a alternativa que relaciona incorretamente o músculo à sua função:", "choices": ["Músculo orbicular da boca: responsável por estreitar a boca e franzir os lábios.", "Músculo deltoide: levanta o braço para o lado, para a frente e para trás.", "Músculo glúteo máximo: endireita o quadril, puxando a coxa para trás.", "Músculo gastrocnêmio: responsável por bombear o sangue do coração.", "Músculo obliquo externo do abdome: flexiona e rotaciona o tronco."], "correct": 3, "explanation": "O gastrocnêmio movimenta o pé (e não o coração)"}, {"n": 26, "stem": "❄️ Em dias muito frios, é comum nosso corpo começar a tremer involuntariamente. Por que a contração dos músculos esqueléticos ajuda nessa situação?", "choices": ["Porque a contração muscular consome gordura e esfria os órgãos internos.", "Porque a contração dos músculos estriados esqueléticos ajuda na geração de calor para manter a temperatura corporal.", "Porque tremer endurece os ossos contra o vento gelado.", "Porque a tremedeira desliga o sistema nervoso central.", "Porque os músculos lisos precisam soltar água para aquecer a pele."], "correct": 1, "explanation": "A contração produz calor para manter a temperatura corporal"}, {"n": 27, "stem": "🔗 As articulações (ou juntas) são os pontos de encontro entre dois ou mais ossos. As suturas presentes no crânio de um adulto não permitem a realização de movimentos. De acordo com a mobilidade, como as suturas são classificadas?", "choices": ["Articulações móveis.", "Articulações semimóveis.", "Articulações imóveis.", "Articulações cartilaginosas livres.", "Articulações musculares."], "correct": 2, "explanation": "Articulações imóveis (suturas)"}, {"n": 28, "stem": "🦵 As articulações do joelho e do quadril possuem cartilagem, um espaço com líquido lubrificante e feixes resistentes de tecido conjuntivo chamados ligamentos. Qual a principal função dos ligamentos nas articulações móveis?", "choices": ["Produzir glóbulos vermelhos para as pernas.", "Manter os ossos unidos e conferir resistência e estabilidade à articulação.", "Conectar o cérebro aos músculos da coxa.", "Revestir a pele por fora dos joelhos.", "Quebrar os sais de cálcio para gerar energia."], "correct": 1, "explanation": "Ligamentos unem os ossos com estabilidade"}, {"n": 29, "stem": "🦾 Durante o movimento de flexão do antebraço (dobrar o braço para cima), o músculo bíceps se contrai enquanto o tríceps relaxa. O que acontece no movimento inverso de extensão do antebraço (esticar o braço)?", "choices": ["O bíceps continua contraído e o tríceps se contrai também.", "O bíceps relaxa e o tríceps se contrai, puxando a ulna através do tendão.", "Ambos os músculos relaxam e a gravidade solta o osso.", "O osso rádio se quebra para permitir o alinhamento.", "O tendão se solta do osso para aliviar a pressão."], "correct": 1, "explanation": "Bíceps relaxa e tríceps se contrai tracionando a ulna"}, {"n": 30, "stem": "😬 Durante a mastigação, os músculos masseter e temporal atuam de forma coordenada para mover a mandíbula. Como é chamada a ação em que dois ou mais músculos se contraem simultaneamente para realizar o mesmo movimento?", "choices": ["Ação antagônica.", "Ação sinérgica.", "Ação involuntária liso-cardíaca.", "Ação de alavanca imóvel.", "Ação de calo ósseo."], "correct": 1, "explanation": "Ação sinérgica (músculos atuam simultaneamente)"}, {"n": 31, "stem": "🧠 Para que você consiga realizar um chute em uma partida de futebol, é necessária uma ação conjunta de diferentes sistemas do organismo. Qual é a sequência correta de eventos comandada pelo corpo?", "choices": ["O músculo cria o sinal elétrico -> o osso manda a ordem para o cérebro -> o nervo relaxa.", "O encéfalo envia um impulso nervoso pela medula espinal até o músculo -> o músculo se contrai e traciona o tendão -> o osso se move na articulação.", "O coração envia cálcio para o osso -> o osso se contrai -> o cérebro recebe a mensagem depois do movimento.", "A articulação gasta toda a gordura -> o tendão vira músculo -> o osso flexiona sozinho.", "O sistema digestório empurra o sangue -> o ar faz o braço esticar."], "correct": 1, "explanation": "Impulso -> Músculo contrai -> Tendão puxa -> Osso move"}, {"n": 32, "stem": "🫀 Além do sistema nervoso, muscular e esquelético, qual é o papel essencial do sistema cardiovascular na realização dos movimentos do corpo?", "choices": ["Transportar gases (oxigênio) e nutrientes para as células musculares gerarem energia e remover resíduos.", "Substituir os tendões rompidos durante as corridas.", "Absorver o impacto entre os ossos do crânio.", "Guardar medula amarela nas veias das pernas.", "Produzir a cartilagem que reveste as costelas."], "correct": 0, "explanation": "Transporta oxigênio, nutrientes e remove resíduos"}, {"n": 33, "stem": "🦅 Os animais vertebrados possuem esqueletos adaptados ao seu modo de vida e ambiente. As aves conseguem voar com facilidade porque possuem asas e qual outra adaptação óssea importante?", "choices": ["Ossos totalmente maciços e pesados cheios de cálcio líquido.", "Ossos porosos (mais leves) que favorecem a locomoção no ar.", "Ausência total de coluna vertebral.", "Músculos lisos nas extremidades das patas.", "Escamas ósseas ao redor da caixa torácica."], "correct": 1, "explanation": "Ossos porosos tornam a ave mais leve para o voo"}, {"n": 34, "stem": "🏃‍♂️ Os exercícios físicos podem ser classificados em aeróbios e anaeróbios. Assinale a opção correta sobre os exercícios aeróbios:", "choices": ["Exigem pouquíssimo oxigênio e duram apenas alguns segundos (ex.: musculação pesada).", "Exigem maior quantidade de gás oxigênio, possuem intensidade média e tempo prolongado (ex.: caminhada, corrida, pedalar).", "São praticados exclusivamente dentro da água gelada.", "Provocam o desgaste irreversível de todos os ossos do corpo.", "Não trazem nenhum benefício ao sistema cardiovascular."], "correct": 1, "explanation": "Aeróbios exigem oxigênio, intensidade média e tempo prolongado"}, {"n": 35, "stem": "🛡️ Para praticar atividades esportivas como andar de skate, patins ou bicicleta com segurança, é fundamental o uso de equipamentos de proteção. Por que o uso de capacetes e joelheiras é recomendado?", "choices": ["Porque eles deixam o corpo mais pesado para correr rápido.", "Porque eles substituem o uso de calçados apropriados.", "Porque contribuem para evitar acidentes e proteger o corpo contra danos e lesões em quedas.", "Porque aumentam a quantidade de osteoblastos na pele.", "Porque transformam a pisada supinada em pisada normal automaticamente."], "correct": 2, "explanation": "Evitam acidentes e lesões em impactos"}], "disc": [{"n": 36, "title": "Raciocínio Anatômico", "prompt": "🦴 Imaginemos que um cientista criou um poção mágica que transformou todos os sais de cálcio e fosfato dos ossos de um atleta em fibras de colágeno puro.\nPergunta: O que aconteceria com a capacidade desse atleta de se manter em pé e correr? Explique a diferença entre a função dos minerais (cálcio e fosfato) e a função do colágeno nos ossos.", "answer": "Os sais de cálcio e fosfato garantem a dureza e rigidez do osso contra fraturas, enquanto o colágeno confere flexibilidade. Se o atleta só tivesse colágeno, seus ossos ficariam moles e \"murchos\" como borracha, impossibilitando que ele ficasse em pé ou corresse sem que as pernas dobrassem."}, {"n": 37, "title": "Análise de Postura e Saúde", "prompt": "🎒 O Nicolas tem 12 anos e pesa 40 kg. Ao arrumar o seu material escolar, ele colocou tantos livros que a sua mochila ficou pesando 9 kg.\nPergunta A: De acordo com as recomendações de saúde, a mochila do Nicolas está adequada ou com excesso de peso? Faça o cálculo do limite máximo recomendado.\nPergunta B: Que tipo de problemas ou desvios na coluna vertebral o excesso de peso na mochila pode causar se mantido por muito tempo? Cite e explique um desvio citado no material.", "answer": "A) A mochila está com excesso de peso. O limite recomendado é de 10% da massa corporal. Para 40 kg, o peso máximo deveria ser de 4 kg (40 x 0,10). A mochila de 9 kg está mais de duas vezes acima do limite seguro!\nB) Pode causar desvios como a Cifose (arredondamento do tórax/corcunda), a Lordose (depressão lombar) ou a Escoliose (desvio lateral), provocando dores e sobrecarga articular."}, {"n": 38, "title": "Biomecânica e Músculos Antagônicos", "prompt": "🏋️ Quando o Nicolas dobra o cotovelo para levar um copo de água até a boca, seu braço realiza o movimento de flexão do antebraço.\nPergunta: Explique detalhadamente a ação dos músculos bíceps e tríceps durante esse movimento, indicando qual músculo se contrai, qual relaxa e qual a função do tendão nessa ação.", "answer": "Durante a flexão do antebraço, o músculo bíceps se contrai (diminui de tamanho) e o músculo tríceps relaxa (ação antagônica). O tendão é a estrutura que liga o bíceps ao osso rádio, tracionando-o (puxando-o) para erguer o antebraço."}, {"n": 39, "title": "Integração de Sistemas", "prompt": "🧠 Durante uma aula de educação física, o professor apita e o Nicolas sai correndo instantaneamente para pegar a bola.\nPergunta: Explique como o Sistema Nervoso, o Sistema Muscular, o Sistema Esquelético e o Sistema Cardiovascular trabalham de forma integrada para que o Nicolas consiga ouvir o apito e realizar a corrida.", "answer": "O Sistema Nervoso gera o comando no encéfalo e envia o impulso elétrico pela medula espinal até o músculo. Ao receber o sinal, o Sistema Muscular se contrai e puxa os tendões. O Sistema Esquelético fornece os ossos e articulações como alavancas de movimento. Enquanto isso, o Sistema Cardiovascular bombeia sangue rico em oxigênio e glicose para alimentar os músculos durante a corrida."}, {"n": 40, "title": "Adaptação Animal Comparada", "prompt": "🐸 🦅 Compare a estrutura do esqueleto e a locomoção do sapo com a de uma ave.\nPergunta: Quais são as adaptações ósseas específicas encontradas nas pernas do sapo e no corpo da ave que permitem, respectivamente, o salto na terra e o voo no ar?", "answer": "Os sapos possuem os membros posteriores (pernas traseiras) alongados e forte musculatura adaptada para impulsionar saltos na terra. As aves possuem membros anteriores modificados em asas e ossos porosos (com cavidades de ar), tornados muito mais leves para facilitar a sustentação durante o voo."}]};
const guide=document.getElementById('guide');
function para(parent,txt,cls=''){const p=document.createElement('p');p.textContent=txt;if(cls)p.className=cls;parent.appendChild(p)}
const intro=document.createElement('article');intro.className='card';DATA.intro.forEach((s,i)=>{if(i===0){let h=document.createElement('h2');h.textContent=s;intro.appendChild(h)}else para(intro,s)});guide.appendChild(intro);
DATA.sections.forEach(s=>{const a=document.createElement('article');a.className='card';const h=document.createElement('h2');h.textContent=s.title;a.appendChild(h);s.lines.forEach(l=>para(a,l,/^(Quantos|Classificação|Do que|Como o|Crânio:|Caixa torácica|Coluna vertebral:|Esqueleto Axial|Esqueleto Apendicular|Os 3 Tipos|Como os Músculos)/.test(l)?'lead':''));guide.appendChild(a)});
let pos=0,points=0,completed=false;const qarea=document.getElementById('question');const saved={};
function show(which){document.getElementById('study').classList.toggle('hidden',which!=='study');document.getElementById('quiz').classList.toggle('hidden',which!=='quiz');document.getElementById('tabStudy').classList.toggle('active',which==='study');document.getElementById('tabQuiz').classList.toggle('active',which==='quiz');if(which==='quiz')render();window.scrollTo({top:0,behavior:'instant'})}
function make(tag,txt,parent,cls){let el=document.createElement(tag);if(txt!==null)el.textContent=txt;if(cls)el.className=cls;parent.appendChild(el);return el}
function next(){pos++;render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){qarea.replaceChildren();document.getElementById('count').textContent=pos<40?`Questão ${pos+1} de 40`:'Concluído';document.getElementById('score').textContent=`Acertos nas objetivas: ${points} / 35`;document.getElementById('bar').style.width=`${Math.min(pos,40)/40*100}%`;if(pos>=40){make('h2','🏆 Quiz concluído!',qarea);para(qarea,`Você acertou ${points} de 35 questões objetivas (${Math.round(points/35*100)}%). As cinco discursivas foram respondidas e podem ser revisadas.`);const b=make('button','🔄 Recomeçar',qarea,'action');b.onclick=()=>{pos=0;points=0;for(let k in saved)delete saved[k];render()};return}if(pos<35){const q=DATA.questions[pos];make('h2',`Questão ${q.n}`,qarea);para(qarea,q.stem);const opts=make('div',null,qarea);const fb=make('div',null,qarea);q.choices.forEach((s,i)=>{const b=make('button',`(${String.fromCharCode(65+i)}) ${s}`,opts,'option');b.onclick=()=>{if(saved[pos]!==undefined)return;saved[pos]=i;if(i===q.correct)points++;opts.querySelectorAll('button').forEach((o,j)=>{o.disabled=true;if(j===q.correct)o.classList.add('correct');else if(j===i)o.classList.add('wrong')});make('strong',i===q.correct?'✅ Acertou!':'❌ Errou!',fb);para(fb,`Gabarito: (${String.fromCharCode(65+q.correct)}) ${q.explanation}`);fb.className='feedback';const n=make('button','Próxima questão →',qarea,'action');n.onclick=next;document.getElementById('score').textContent=`Acertos nas objetivas: ${points} / 35`}})});if(saved[pos]!==undefined){const selected=saved[pos];opts.querySelectorAll('button').forEach((o,j)=>{o.disabled=true;if(j===q.correct)o.classList.add('correct');else if(j===selected)o.classList.add('wrong')});make('strong',selected===q.correct?'✅ Acertou!':'❌ Errou!',fb);para(fb,`Gabarito: (${String.fromCharCode(65+q.correct)}) ${q.explanation}`);fb.className='feedback';make('button','Próxima questão →',qarea,'action').onclick=next}}
else{const q=DATA.disc[pos-35];make('h2',`Questão ${q.n} — ${q.title}`,qarea);para(qarea,q.prompt);const ta=make('textarea',null,qarea);ta.placeholder='Digite sua resposta aqui...';ta.value=saved[pos]?.text||'';ta.oninput=()=>{saved[pos]={...(saved[pos]||{}),text:ta.value}};const model=make('div',null,qarea,'model hidden');make('strong','🔑 Resposta sugerida:',model);para(model,q.answer);const reveal=make('button','Conferir resposta sugerida',qarea,'action');const n=make('button',pos===39?'Concluir quiz →':'Próxima questão →',qarea,'action');n.style.marginLeft='8px';n.disabled=true;reveal.onclick=()=>{model.classList.remove('hidden');n.disabled=false};n.onclick=next}}
