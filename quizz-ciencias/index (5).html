<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ciências do Nicolas | Sustentação e Movimento</title><style>:root{font-family:system-ui,Arial,sans-serif;color:#17233c;background:#eef4ff}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#1843a8,#6a42b7);color:white;padding:35px 18px;text-align:center}header h1{font-size:clamp(26px,5vw,44px);margin:8px}header p{margin:5px}main{max-width:920px;margin:auto;padding:20px}nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0}.tab{border:0;border-radius:14px;background:white;padding:13px 18px;font-weight:700;cursor:pointer;color:#183b8d}.tab.active{background:#ffdf67;color:#1d2450}.chapter{background:white;border-radius:18px;margin:14px 0;padding:20px;box-shadow:0 5px 16px #17233c10}.chapter h2{margin-top:0;color:#2148a1}.fact{padding:10px 0;border-bottom:1px solid #edf0f5;line-height:1.65}.fact:last-child{border:0}.fact strong{color:#50399c}button{cursor:pointer;font:inherit}.action{border:0;background:#2148a1;color:white;padding:12px 18px;border-radius:12px;font-weight:700}.muted{color:#54647d}.quizcard{background:white;border-radius:18px;padding:24px;box-shadow:0 5px 18px #17233c15}.option{display:block;width:100%;text-align:left;padding:15px;margin:10px 0;border:2px solid #dce5f5;border-radius:12px;background:#f8faff}.option:disabled{cursor:default}.option.correct{background:#c8f4d5;border-color:#15803d;color:#13532a}.option.wrong{background:#ffd6d6;border-color:#c52d2d;color:#812020}.feedback{padding:14px;border-radius:12px;background:#f1f5ff;margin:14px 0;line-height:1.5}.progress{height:12px;background:#dce5f5;border-radius:12px;overflow:hidden;margin:15px 0}.progress div{height:100%;background:#25a978;transition:width .2s}.hidden{display:none}.small{font-size:14px}footer{text-align:center;padding:30px;color:#52627b}</style></head><body><header><div style="font-size:42px">🦴💪🚀</div><h1>Ciências do Nicolas</h1><p>Sustentação e movimentação do corpo humano</p><p>Estude os 8 capítulos e depois enfrente o desafio!</p></header><main><nav><button id="studyTab" class="tab active" onclick="switchTab('study')">📚 Estudar</button><button id="quizTab" class="tab" onclick="switchTab('quiz')">🧠 Quiz (40 questões)</button></nav><section id="study"><div id="chapters"></div><div style="text-align:center;margin:25px"><button class="action" onclick="switchTab('quiz')">Já estudei! Começar o quiz →</button></div></section><section id="quiz" class="hidden"><div id="quizArea" class="quizcard"></div></section></main><footer>Feito para o Nicolas • Bons estudos! 🌟</footer><script>const DATA={"sections": [["🦴", "Sistema Esquelético", [["Funções", "O esqueleto sustenta o corpo, dá forma, ajuda nos movimentos e protege órgãos internos. É formado por ossos e cartilagens."], ["Quantos ossos?", "Um recém-nascido tem aproximadamente 270 a 300 elementos ósseos, muitos dos quais se fundem durante o crescimento. No adulto, geralmente são 206 ossos."], ["Tipos de ossos", "Longos: fêmur, úmero, rádio, ulna, tíbia, fíbula e falanges. Curtos: ossos do carpo e tarso. Planos: crânio, esterno, costelas e escápula. Irregulares: vértebras."], ["Estrutura óssea", "Sais de cálcio e fosfato conferem dureza; colágeno oferece resistência e alguma flexibilidade. O periósteo reveste a superfície externa dos ossos, exceto áreas articulares. A medula vermelha produz células do sangue; a amarela é rica em gordura."], ["Divisão do esqueleto", "Axial: crânio, coluna vertebral, costelas e esterno. Apendicular: membros superiores e inferiores e cinturas escapular e pélvica. O crânio protege o encéfalo; a caixa torácica protege coração e pulmões; a coluna protege a medula espinal."]]], ["🌱", "Crescimento e Regeneração", [["Moleira", "As fontanelas são espaços membranosos entre os ossos do crânio do bebê; fecham-se gradualmente com o crescimento."], ["Cartilagem", "Tecido resistente e flexível presente no nariz, orelhas, traqueia e superfícies articulares. Os discos intervertebrais contêm fibrocartilagem e ajudam a absorver impactos; a cartilagem articular diminui o atrito."], ["Alimentação", "Cálcio e vitamina D, juntamente com alimentação equilibrada e atividade física, contribuem para a saúde óssea. Fontes de cálcio incluem leite, derivados e vegetais verde-escuros."], ["Fraturas", "Osteoblastos formam matriz óssea. Na cicatrização, forma-se um calo ósseo, que depois é remodelado."], ["Raio X", "Wilhelm Röntgen descobriu os raios X em 1895. Ossos costumam aparecer mais claros nas radiografias por absorverem mais radiação."]]], ["🧍", "Coluna e Pés", [["Curvaturas", "A coluna tem curvaturas fisiológicas nas regiões cervical, torácica, lombar e sacral. Cifose e lordose também são nomes de curvaturas normais; quando exageradas, podem ser alterações posturais. Escoliose é uma curvatura lateral anormal da coluna."], ["Mochila", "Como orientação prática, procure manter a mochila leve, frequentemente recomendada em até cerca de 10% da massa corporal, distribuindo o peso nas duas alças."], ["Pisada", "Na caminhada ocorrem contato inicial, apoio e impulsão. Pronação e supinação são movimentos normais do pé; quando excessivos podem alterar a distribuição de cargas."]]], ["💪", "Sistema Muscular", [["Funções", "Os músculos realizam movimentos, mantêm a postura e produzem calor. Sua propriedade principal é a contração."], ["Três tecidos", "Estriado esquelético: geralmente voluntário e ligado aos ossos. Estriado cardíaco: involuntário, forma o coração. Liso: involuntário, presente no intestino, bexiga e vasos sanguíneos."], ["Trabalho em equipe", "Ao dobrar o cotovelo, o bíceps atua como principal flexor e o tríceps se alonga; ao estender, o tríceps atua como principal extensor. Masseter e temporal colaboram na mastigação."]]], ["🔗", "Articulações e Tendões", [["Articulações", "São regiões de união entre ossos. Há articulações praticamente imóveis (suturas do crânio), pouco móveis (entre corpos vertebrais) e muito móveis (joelho, cotovelo e quadril)."], ["Lubrificação e ligamentos", "Nas articulações sinoviais, o líquido sinovial reduz o atrito; ligamentos unem ossos e ajudam na estabilidade."], ["Tendões", "Unem músculos a ossos e transmitem a força muscular para produzir movimento."]]], ["⚡", "Integração dos Sistemas", [["Sistema nervoso", "O encéfalo e a medula espinal coordenam movimentos; sinais seguem pelos nervos até os músculos."], ["Músculos, ossos e articulações", "Os músculos se contraem, os tendões transmitem a força e os ossos se movimentam nas articulações."], ["Sistema cardiovascular", "O sangue transporta oxigênio e nutrientes necessários ao trabalho muscular."]]], ["🐸", "Movimentação dos Animais", [["Vertebrados", "Os vertebrados possuem coluna vertebral. Durante o desenvolvimento embrionário, a notocorda participa da organização do eixo corporal."], ["Exemplos", "Sapos: membros posteriores adaptados a saltos. Aves: asas e, em muitas espécies voadoras, ossos pneumáticos que ajudam a reduzir o peso. Peixes: nadadeiras e formato hidrodinâmico para nadar."]]], ["🚴", "Atividade Física e Saúde", [["Benefícios", "Atividade física regular contribui para a saúde cardiovascular, força, sono, bem-estar e manutenção de ossos e músculos."], ["Aeróbio e anaeróbio", "Atividades aeróbias incluem caminhada, corrida e bicicleta. Esforços anaeróbios predominam em ações intensas e breves, como sprints e algumas séries de musculação."], ["Segurança", "Aquecimento progressivo prepara o corpo para o exercício. Alongamentos podem melhorar flexibilidade, mas não garantem prevenção de lesões. Use capacete e proteções adequadas em bicicleta e skate."]]]], "questions": [["Qual é a principal função do esqueleto?", ["Produzir alimentos", "Sustentar o corpo e proteger órgãos", "Bombear sangue", "Controlar a respiração"], 1, "O esqueleto sustenta o corpo, auxilia nos movimentos e protege órgãos."], ["Quantos ossos costuma ter um adulto?", ["106", "206", "306", "406"], 1, "O número de referência é 206 ossos."], ["Qual é um osso longo?", ["Fêmur", "Vértebra", "Osso do carpo", "Esterno"], 0, "O fêmur é um osso longo da coxa."], ["Qual é um exemplo de osso irregular?", ["Costela", "Esterno", "Vértebra", "Fêmur"], 2, "As vértebras apresentam formatos complexos."], ["Qual substância contribui para a dureza dos ossos?", ["Colágeno sozinho", "Sais de cálcio e fosfato", "Água apenas", "Gordura"], 1, "Os minerais dão dureza à matriz óssea."], ["Qual medula produz células do sangue?", ["Amarela", "Espinal", "Vermelha", "Nenhuma"], 2, "A medula óssea vermelha realiza hematopoiese."], ["O que reveste externamente grande parte dos ossos?", ["Periósteo", "Tendão", "Cartilagem elástica", "Pele"], 0, "O periósteo é a membrana de revestimento ósseo."], ["Qual estrutura pertence ao esqueleto axial?", ["Fêmur", "Úmero", "Coluna vertebral", "Tíbia"], 2, "A coluna integra o esqueleto axial."], ["Qual estrutura protege o coração e os pulmões?", ["Crânio", "Caixa torácica", "Pelve", "Mão"], 1, "Costelas e esterno ajudam a proteger esses órgãos."], ["O que são as moleiras?", ["Músculos do bebê", "Espaços membranosos entre ossos do crânio", "Fraturas", "Tendões"], 1, "São as fontanelas, que se fecham gradualmente."], ["Qual célula produz matriz óssea?", ["Osteoblasto", "Hemácia", "Neurônio", "Plaqueta"], 0, "Os osteoblastos participam da formação do osso."], ["O que se forma durante a consolidação de uma fratura?", ["Calo ósseo", "Novo músculo cardíaco", "Uma unha", "Um nervo extra"], 0, "O calo ósseo participa da reparação da fratura."], ["Qual tecnologia ajuda a identificar fraturas?", ["Microscópio óptico", "Radiografia", "Termômetro", "Estetoscópio"], 1, "Radiografias permitem observar ossos e muitas fraturas."], ["Qual nutriente é importante para a saúde óssea?", ["Cálcio", "Cafeína", "Corante", "Sal em excesso"], 0, "O cálcio é importante para a mineralização óssea."], ["O que há entre corpos vertebrais?", ["Discos intervertebrais", "Dentes", "Unhas", "Pulmões"], 0, "Os discos amortecem cargas e permitem pequenos movimentos."], ["O que caracteriza a escoliose?", ["Curvatura lateral anormal da coluna", "Braço quebrado", "Contração do coração", "Movimento do joelho"], 0, "Escoliose é uma alteração tridimensional da coluna com desvio lateral."], ["Qual é uma orientação prática para mochila escolar?", ["Quanto mais pesada, melhor", "Usar apenas uma alça sempre", "Mantê-la leve e usar as duas alças", "Carregá-la na cabeça"], 2, "Distribuir o peso e evitar excesso de carga ajuda no conforto."], ["Pronação e supinação são:", ["Tipos de osso", "Movimentos do pé", "Células do sangue", "Partes do coração"], 1, "São movimentos normais envolvidos na mecânica dos pés."], ["Qual tecido muscular geralmente é voluntário?", ["Liso", "Cardíaco", "Estriado esquelético", "Nenhum"], 2, "O músculo estriado esquelético permite muitos movimentos voluntários."], ["Qual músculo forma o coração?", ["Liso", "Estriado cardíaco", "Estriado esquelético", "Tendão"], 1, "O miocárdio é composto por tecido muscular estriado cardíaco."], ["Onde encontramos músculo liso?", ["Parede intestinal", "Fêmur", "Esmalte do dente", "Unha"], 0, "Músculo liso está nas paredes de muitos órgãos internos."], ["Ao flexionar o cotovelo, qual músculo atua como importante flexor?", ["Tríceps", "Bíceps", "Panturrilha", "Masseter"], 1, "O bíceps braquial contribui para a flexão do cotovelo."], ["Qual par ajuda na mastigação?", ["Bíceps e tríceps", "Masseter e temporal", "Quadríceps e bíceps", "Diafragma e panturrilha"], 1, "Masseter e temporal elevam a mandíbula."], ["O que são articulações?", ["Pontos de união entre ossos", "Células de defesa", "Reservas de gordura", "Tipos de sangue"], 0, "As articulações conectam elementos do esqueleto."], ["Qual articulação permite grande mobilidade?", ["Sutura craniana", "Joelho", "União fixa do crânio", "Nenhuma"], 1, "O joelho é uma articulação sinovial móvel."], ["O que liga músculo ao osso?", ["Ligamento", "Tendão", "Medula vermelha", "Cartilagem nasal"], 1, "Os tendões transmitem a força dos músculos aos ossos."], ["O que liga osso a osso em muitas articulações?", ["Ligamento", "Tendão", "Neurônio", "Hemácia"], 0, "Ligamentos contribuem para a estabilidade articular."], ["Qual líquido reduz atrito nas articulações sinoviais?", ["Saliva", "Líquido sinovial", "Suor", "Sangue"], 1, "O líquido sinovial lubrifica a articulação."], ["Qual sistema envia sinais para os músculos?", ["Digestório", "Nervoso", "Urinário", "Tegumentar"], 1, "O sistema nervoso coordena a ativação muscular."], ["O que o sangue fornece aos músculos?", ["Somente água", "Oxigênio e nutrientes", "Somente cálcio", "Somente hormônios"], 1, "O sistema cardiovascular transporta oxigênio e nutrientes."], ["Qual animal tem membros posteriores adaptados ao salto?", ["Sapo", "Peixe", "Minhoca", "Estrela-do-mar"], 0, "Os membros posteriores dos sapos ajudam nos saltos."], ["Qual estrutura ajuda peixes a nadar?", ["Asas", "Nadadeiras", "Pelos", "Chifres"], 1, "Nadadeiras participam da propulsão e direção."], ["O que são ossos pneumáticos em muitas aves?", ["Ossos com espaços aéreos", "Ossos de borracha", "Ossos sem minerais", "Ossos líquidos"], 0, "Espaços aéreos em alguns ossos contribuem para a leveza."], ["Qual é uma atividade tipicamente aeróbia?", ["Caminhada contínua", "Um salto isolado", "Levantar peso uma vez", "Arremesso único"], 0, "A caminhada contínua envolve metabolismo predominantemente aeróbio."], ["Qual atividade pode envolver esforço anaeróbio intenso?", ["Sprint curto", "Passeio leve", "Dormir", "Leitura"], 0, "Esforços muito intensos e breves dependem bastante de vias anaeróbias."], ["Qual é um benefício da atividade física regular?", ["Piora obrigatória do sono", "Fortalecimento cardiovascular", "Desaparecimento dos ossos", "Imobilidade"], 1, "Exercícios regulares beneficiam coração, músculos e bem-estar."], ["Qual proteção é essencial ao pedalar?", ["Capacete adequado", "Chapéu de papel", "Luvas de lã apenas", "Nenhuma"], 0, "O capacete ajuda a reduzir o risco de lesões na cabeça."], ["Qual prática prepara o corpo para o treino?", ["Aquecimento progressivo", "Começar sempre no máximo", "Ignorar sinais de dor", "Evitar água"], 0, "O aquecimento prepara gradualmente o organismo."], ["O que acontece com vários ossos ao longo do crescimento?", ["Todos desaparecem", "Alguns se fundem", "Viraram músculos", "Todos se partem"], 1, "A fusão de elementos ósseos explica parte da diferença entre bebês e adultos."], ["Qual sistema trabalha com músculos e ossos para realizar movimentos?", ["Nervoso", "Somente digestório", "Somente urinário", "Nenhum"], 0, "O sistema nervoso comanda a ativação muscular para produzir movimentos."]]};let index=0,score=0,answered=false,order=[];const chapters=document.getElementById('chapters'),area=document.getElementById('quizArea');DATA.sections.forEach(([emoji,title,facts],i)=>{let el=document.createElement('article');el.className='chapter';el.innerHTML=`<h2>${i+1}. ${emoji} ${title}</h2>`+facts.map(([heading,content])=>`<div class="fact"><strong>${heading}</strong><div>${content}</div></div>`).join('');chapters.appendChild(el)});function switchTab(tab){document.getElementById('study').classList.toggle('hidden',tab!=='study');document.getElementById('quiz').classList.toggle('hidden',tab!=='quiz');document.getElementById('studyTab').classList.toggle('active',tab==='study');document.getElementById('quizTab').classList.toggle('active',tab==='quiz');if(tab==='quiz'&&!order.length)restart();window.scrollTo(0,0)}function restart(){index=0;score=0;answered=false;order=[...DATA.questions.keys()];for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}render()}function render(){if(index>=order.length){area.innerHTML=`<h2>🏆 Desafio concluído!</h2><h1>${score} / ${order.length} acertos</h1><p>Você acertou ${Math.round(score/order.length*100)}% das questões. ${score>=32?'Excelente trabalho! 🌟':'Continue estudando, você consegue! 💪'}</p><button class="action" onclick="restart()">🔄 Jogar novamente</button> <button class="action" onclick="switchTab('study')">📚 Revisar conteúdo</button>`;return}answered=false;let q=DATA.questions[order[index]];area.innerHTML=`<p class="muted">Questão ${index+1} de ${order.length} · Acertos: ${score}</p><div class="progress"><div style="width:${100*index/order.length}%"></div></div><h2>${q[0]}</h2><div id="answers"></div><div id="feedback"></div>`;q[1].forEach((a,i)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+') '+a;b.onclick=()=>choose(i);document.getElementById('answers').appendChild(b)})}function choose(i){if(answered)return;answered=true;let q=DATA.questions[order[index]];if(i===q[2])score++;document.querySelectorAll('.option').forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add('correct');else if(j===i)b.classList.add('wrong')});document.getElementById('feedback').innerHTML=`<div class="feedback"><strong>${i===q[2]?'✅ Você acertou!':'❌ Você errou!'}</strong><p>Resposta correta: ${String.fromCharCode(65+q[2])}) ${q[1][q[2]]}</p><p><strong>Explicação:</strong> ${q[3]}</p></div><button class="action" onclick="index++;render()">${index===order.length-1?'Ver resultado 🏆':'Próxima questão →'}</button>`}</script></body></html>
