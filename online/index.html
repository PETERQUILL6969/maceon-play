<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Maceon Online - Multiplayer Test</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0d1117;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

.page {
    width: min(94%, 900px);
    margin: 0 auto;
    padding: 25px 0 40px;
}

header {
    text-align: center;
    margin-bottom: 18px;
}

header h1 {
    margin: 0;
    font-size: 32px;
    letter-spacing: 2px;
}

header p {
    margin: 7px 0 0;
    color: #8b949e;
}

.connection {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin: 15px 0;
    font-weight: bold;
}

.connection-dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: #f1c40f;
}

.connection-dot.connected {
    background: #2ecc71;
}

.connection-dot.disconnected {
    background: #e74c3c;
}

.panel {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 15px;
    padding: 18px;
    margin-bottom: 16px;
}

.login label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

.login-row {
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    min-width: 0;
    height: 48px;
    border: 1px solid #3b4553;
    border-radius: 9px;
    background: #0d1117;
    color: white;
    padding: 0 13px;
    font-size: 16px;
}

button {
    border: 0;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    touch-action: manipulation;
}

#enterButton {
    min-width: 150px;
    padding: 0 20px;
    background: #238636;
    color: white;
}

#enterButton:disabled {
    opacity: .55;
    cursor: not-allowed;
}

.message {
    min-height: 18px;
    margin-top: 10px;
    text-align: center;
    font-size: 14px;
    color: #8b949e;
}

.message.success {
    color: #3fb950;
}

.message.error {
    color: #ff7b72;
}

/* ================================
   MUNDO
================================ */

.world-panel {
    padding: 12px;
}

.world-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
}

.world-header strong {
    font-size: 17px;
}

.online-count {
    background: #238636;
    border-radius: 20px;
    padding: 7px 12px;
    font-size: 13px;
    font-weight: bold;
}

#world {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 10;
    min-height: 320px;
    overflow: hidden;
    border-radius: 12px;
    border: 4px solid #263238;

    background:
        linear-gradient(
            rgba(255,255,255,.04) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.04) 1px,
            transparent 1px
        ),
        #477d3b;

    background-size: 32px 32px;
}

/* caminhos */
.path-horizontal {
    position: absolute;
    left: 0;
    top: 44%;
    width: 100%;
    height: 24%;
    background: #c8ad75;
}

.path-vertical {
    position: absolute;
    left: 42%;
    top: 0;
    width: 16%;
    height: 100%;
    background: #c8ad75;
}

/* lago */
.lake {
    position: absolute;
    right: 4%;
    top: 6%;
    width: 23%;
    height: 25%;
    background: #4799c7;
    border: 5px solid #87c7df;
    border-radius: 16px;
}

/* árvores */
.tree {
    position: absolute;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #174c2a;
    border: 5px solid #286b38;
}

/* ================================
   JOGADORES
================================ */

.player {
    position: absolute;
    width: 42px;
    height: 54px;

    transform: translate(-50%, -50%);

    transition:
        left 90ms linear,
        top 90ms linear;

    z-index: 20;
    pointer-events: none;
}

.player-body {
    position: absolute;
    left: 8px;
    top: 13px;
    width: 26px;
    height: 34px;
    background: #e53935;
    border: 3px solid #17202a;
    border-radius: 7px;
}

.player-head {
    position: absolute;
    left: 10px;
    top: 0;
    width: 22px;
    height: 22px;
    background: #f0c39b;
    border: 3px solid #17202a;
    border-radius: 50%;
    z-index: 2;
}

.player-cap {
    position: absolute;
    left: 7px;
    top: -3px;
    width: 28px;
    height: 11px;
    background: #d32f2f;
    border: 3px solid #17202a;
    border-radius: 10px 10px 3px 3px;
    z-index: 3;
}

.player.me .player-body {
    background: #1976d2;
}

.player-name {
    position: absolute;
    left: 50%;
    bottom: 100%;
    transform: translateX(-50%);
    margin-bottom: 4px;

    max-width: 120px;
    padding: 3px 7px;

    background: rgba(0,0,0,.72);
    border-radius: 6px;

    color: white;
    font-size: 11px;
    font-weight: bold;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.player.me .player-name {
    color: #69b7ff;
}

/* direção */
.player[data-direction="left"] .player-body {
    transform: rotate(-3deg);
}

.player[data-direction="right"] .player-body {
    transform: rotate(3deg);
}

/* ================================
   CONTROLES
================================ */

.controls-panel {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    align-items: center;
}

.instructions {
    color: #aeb8c4;
    line-height: 1.5;
}

.instructions strong {
    color: white;
}

.dpad {
    width: 190px;
    margin: auto;

    display: grid;

    grid-template-columns:
        58px 58px 58px;

    grid-template-rows:
        58px 58px 58px;

    gap: 5px;

    justify-content: center;
}

.move {
    width: 58px;
    height: 58px;

    background: #30363d;
    color: white;

    font-size: 25px;

    border: 1px solid #4b5563;

    user-select: none;
    -webkit-user-select: none;
}

.move:active {
    background: #238636;
}

.up {
    grid-column: 2;
    grid-row: 1;
}

.left {
    grid-column: 1;
    grid-row: 2;
}

.center {
    grid-column: 2;
    grid-row: 2;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #0d1117;
    border-radius: 50%;

    color: #8b949e;
    font-size: 12px;
}

.right {
    grid-column: 3;
    grid-row: 2;
}

.down {
    grid-column: 2;
    grid-row: 3;
}

.players-title {
    font-weight: bold;
    margin-bottom: 10px;
}

#playersList {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.player-chip {
    padding: 7px 10px;
    border-radius: 15px;
    background: #0d1117;
    border: 1px solid #30363d;
    font-size: 13px;
}

.player-chip.me {
    color: #58a6ff;
}

@media(max-width: 650px) {

    .page {
        width: 96%;
        padding-top: 18px;
    }

    header h1 {
        font-size: 26px;
    }

    .login-row {
        flex-direction: column;
    }

    #enterButton {
        height: 48px;
    }

    #world {
        min-height: 360px;
        aspect-ratio: auto;
        height: 430px;
    }

    .controls-panel {
        grid-template-columns: 1fr;
    }

    .instructions {
        text-align: center;
    }
}
</style>
</head>

<body>

<div class="page">

<header>
    <h1>MACEON ONLINE</h1>
    <p>Sala multiplayer em tempo real</p>
</header>

<div class="connection">
    <span id="connectionDot"
          class="connection-dot"></span>

    <span id="connectionText">
        Conectando ao servidor...
    </span>
</div>


<div class="panel login">

    <label for="playerName">
        Nome do jogador
    </label>

    <div class="login-row">

        <input
            id="playerName"
            maxlength="20"
            autocomplete="off"
            placeholder="Digite seu nome"
        >

        <button
            id="enterButton"
            disabled
        >
            ENTRAR
        </button>

    </div>

    <div
        id="message"
        class="message"
    ></div>

</div>


<div class="panel world-panel">

    <div class="world-header">

        <strong>
            MAPA DE TESTE
        </strong>

        <span
            id="onlineCount"
            class="online-count"
        >
            0 ONLINE
        </span>

    </div>


    <div id="world">

        <div class="path-horizontal"></div>
        <div class="path-vertical"></div>

        <div class="lake"></div>

        <div class="tree"
             style="left:5%;top:8%;">
        </div>

        <div class="tree"
             style="left:12%;top:16%;">
        </div>

        <div class="tree"
             style="left:20%;top:8%;">
        </div>

        <div class="tree"
             style="left:6%;bottom:8%;">
        </div>

        <div class="tree"
             style="left:15%;bottom:15%;">
        </div>

        <div class="tree"
             style="right:7%;bottom:9%;">
        </div>

        <div class="tree"
             style="right:15%;bottom:17%;">
        </div>

    </div>

</div>


<div class="panel controls-panel">

    <div class="instructions">

        <strong>Movimente seu personagem</strong>

        <br><br>

        Computador:
        use as teclas
        <strong>↑ ↓ ← →</strong>
        ou
        <strong>W A S D</strong>.

        <br><br>

        Celular:
        use os botões ao lado.

    </div>


    <div class="dpad">

        <button
            class="move up"
            data-direction="up"
        >
            ▲
        </button>

        <button
            class="move left"
            data-direction="left"
        >
            ◀
        </button>

        <div class="center">
            MOVE
        </div>

        <button
            class="move right"
            data-direction="right"
        >
            ▶
        </button>

        <button
            class="move down"
            data-direction="down"
        >
            ▼
        </button>

    </div>

</div>


<div class="panel">

    <div class="players-title">
        Jogadores conectados
    </div>

    <div id="playersList">
        Nenhum jogador conectado.
    </div>

</div>

</div>


<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";


import {
    getDatabase,
    ref,
    set,
    update,
    onValue,
    onDisconnect,
    remove,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";


/* ========================================
   FIREBASE
======================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyCEODc2z5Rw-cOF3yyGDMaN12ZXFzngXQc",

    authDomain:
        "maceon-online-14634.firebaseapp.com",

    databaseURL:
        "https://maceon-online-14634-default-rtdb.firebaseio.com",

    projectId:
        "maceon-online-14634",

    storageBucket:
        "maceon-online-14634.firebasestorage.app",

    messagingSenderId:
        "318725187398",

    appId:
        "1:318725187398:web:b838938a9b94a3bd34e747"
};


const app =
    initializeApp(firebaseConfig);

const database =
    getDatabase(app);


/* ========================================
   ELEMENTOS
======================================== */

const world =
    document.getElementById("world");

const playerNameInput =
    document.getElementById("playerName");

const enterButton =
    document.getElementById("enterButton");

const message =
    document.getElementById("message");

const onlineCount =
    document.getElementById("onlineCount");

const playersList =
    document.getElementById("playersList");

const connectionDot =
    document.getElementById("connectionDot");

const connectionText =
    document.getElementById("connectionText");


/* ========================================
   ID DESTA ABA
======================================== */

let playerId =
    sessionStorage.getItem(
        "maceonOnlinePlayerId"
    );

if (!playerId) {

    if (crypto.randomUUID) {

        playerId =
            crypto.randomUUID();

    } else {

        playerId =
            "player-" +
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .substring(2,10);

    }

    sessionStorage.setItem(
        "maceonOnlinePlayerId",
        playerId
    );
}


/* ========================================
   ESTADO LOCAL
======================================== */

let joined = false;

let currentPlayerRef = null;

let myX = 50;
let myY = 60;

let myDirection = "down";

let moving = false;


/* ========================================
   CONEXÃO
======================================== */

const connectedRef =
    ref(
        database,
        ".info/connected"
    );


onValue(
    connectedRef,
    async snapshot => {

        const connected =
            snapshot.val() === true;

        if (connected) {

            connectionDot.className =
                "connection-dot connected";

            connectionText.textContent =
                "Servidor conectado";

            if (!joined) {
                enterButton.disabled = false;
            }

            /*
            Se o jogador já estava na sala e
            perdeu/reestabeleceu conexão,
            registramos novamente o onDisconnect.
            */

            if (
                joined &&
                currentPlayerRef
            ) {

                await onDisconnect(
                    currentPlayerRef
                ).remove();

                await set(
                    currentPlayerRef,
                    {
                        name:
                            playerNameInput.value.trim(),

                        x: myX,
                        y: myY,

                        direction:
                            myDirection,

                        map:
                            "test-room",

                        online: true,

                        joinedAt:
                            serverTimestamp()
                    }
                );

            }

        } else {

            connectionDot.className =
                "connection-dot disconnected";

            connectionText.textContent =
                "Servidor desconectado";

            enterButton.disabled = true;

        }

    }
);


/* ========================================
   ENTRAR NA SALA
======================================== */

async function enterOnline() {

    const name =
        playerNameInput
            .value
            .trim();

    if (!name) {

        showMessage(
            "Digite seu nome.",
            "error"
        );

        return;
    }

    if (joined) return;


    enterButton.disabled = true;

    enterButton.textContent =
        "ENTRANDO...";


    /*
    posição inicial ligeiramente
    diferente para cada jogador
    */

    myX =
        35 +
        Math.random() * 30;

    myY =
        40 +
        Math.random() * 25;


    currentPlayerRef =
        ref(
            database,
            "players/" + playerId
        );


    try {

        await onDisconnect(
            currentPlayerRef
        ).remove();


        await set(
            currentPlayerRef,
            {

                name: name,

                x: myX,

                y: myY,

                direction:
                    "down",

                map:
                    "test-room",

                online:
                    true,

                joinedAt:
                    serverTimestamp()

            }
        );


        joined = true;

        playerNameInput.disabled =
            true;

        enterButton.textContent =
            "VOCÊ ESTÁ NA SALA";

        enterButton.disabled =
            true;


        showMessage(
            "Você entrou no mapa multiplayer.",
            "success"
        );


    } catch(error) {

        console.error(error);

        enterButton.disabled =
            false;

        enterButton.textContent =
            "ENTRAR";

        showMessage(
            "Erro ao entrar na sala.",
            "error"
        );

    }

}


/* ========================================
   MOVIMENTO
======================================== */

async function movePlayer(direction) {

    if (
        !joined ||
        !currentPlayerRef
    ) {
        return;
    }


    const step = 2.4;

    myDirection =
        direction;


    if (direction === "up") {
        myY -= step;
    }

    if (direction === "down") {
        myY += step;
    }

    if (direction === "left") {
        myX -= step;
    }

    if (direction === "right") {
        myX += step;
    }


    /*
    limites do mapa
    */

    myX =
        Math.max(
            4,
            Math.min(
                96,
                myX
            )
        );

    myY =
        Math.max(
            7,
            Math.min(
                93,
                myY
            )
        );


    try {

        await update(
            currentPlayerRef,
            {

                x: myX,

                y: myY,

                direction:
                    myDirection,

                lastMove:
                    serverTimestamp()

            }
        );

    } catch(error) {

        console.error(
            "Erro no movimento:",
            error
        );

    }

}


/* ========================================
   TECLADO
======================================== */

const keys = new Set();


function keyToDirection(key) {

    key =
        key.toLowerCase();

    if (
        key === "arrowup" ||
        key === "w"
    ) return "up";

    if (
        key === "arrowdown" ||
        key === "s"
    ) return "down";

    if (
        key === "arrowleft" ||
        key === "a"
    ) return "left";

    if (
        key === "arrowright" ||
        key === "d"
    ) return "right";

    return null;
}


document.addEventListener(
    "keydown",
    event => {

        if (
            document.activeElement ===
            playerNameInput
        ) {
            return;
        }

        const direction =
            keyToDirection(
                event.key
            );

        if (!direction) return;

        event.preventDefault();

        keys.add(direction);

    }
);


document.addEventListener(
    "keyup",
    event => {

        const direction =
            keyToDirection(
                event.key
            );

        if (!direction) return;

        keys.delete(direction);

    }
);


/*
loop do teclado
*/

setInterval(
    () => {

        if (!joined) return;

        const direction =
            Array
                .from(keys)
                .at(-1);

        if (direction) {

            movePlayer(
                direction
            );

        }

    },
    85
);


/* ========================================
   CONTROLES TOUCH
======================================== */

document
    .querySelectorAll(".move")
    .forEach(button => {

        let interval = null;

        const direction =
            button.dataset.direction;


        function startMove(event) {

            event.preventDefault();

            movePlayer(
                direction
            );

            clearInterval(
                interval
            );

            interval =
                setInterval(
                    () => {

                        movePlayer(
                            direction
                        );

                    },
                    100
                );

        }


        function stopMove() {

            clearInterval(
                interval
            );

            interval = null;

        }


        button.addEventListener(
            "pointerdown",
            startMove
        );

        button.addEventListener(
            "pointerup",
            stopMove
        );

        button.addEventListener(
            "pointercancel",
            stopMove
        );

        button.addEventListener(
            "pointerleave",
            stopMove
        );

    });


/* ========================================
   RECEBER JOGADORES
======================================== */

const playersRef =
    ref(
        database,
        "players"
    );


onValue(
    playersRef,
    snapshot => {

        const players =
            snapshot.val() || {};

        renderPlayers(
            players
        );

    }
);


/* ========================================
   DESENHAR JOGADORES
======================================== */

function renderPlayers(players) {

    const entries =
        Object.entries(players)
            .filter(
                ([id, player]) =>
                    player.map ===
                    "test-room"
            );


    onlineCount.textContent =
        entries.length +
        " ONLINE";


    /*
    Remove personagens que
    não estão mais conectados.
    */

    world
        .querySelectorAll(
            ".player"
        )
        .forEach(element => {

            const id =
                element.dataset.id;

            if (!players[id]) {

                element.remove();

            }

        });


    /*
    cria ou atualiza
    personagens
    */

    entries.forEach(
        ([id, player]) => {

            let element =
                world.querySelector(
                    `.player[data-id="${id}"]`
                );


            if (!element) {

                element =
                    createPlayerElement(
                        id,
                        player
                    );

                world.appendChild(
                    element
                );

            }


            element.style.left =
                Number(player.x || 50) +
                "%";

            element.style.top =
                Number(player.y || 50) +
                "%";


            element.dataset.direction =
                player.direction ||
                "down";


            const name =
                element.querySelector(
                    ".player-name"
                );

            name.textContent =
                player.name ||
                "Jogador";


            if (id === playerId) {

                element.classList.add(
                    "me"
                );

            } else {

                element.classList.remove(
                    "me"
                );

            }

        }
    );


    /*
    lista inferior
    */

    playersList.innerHTML =
        "";


    if (entries.length === 0) {

        playersList.textContent =
            "Nenhum jogador conectado.";

        return;

    }


    entries.forEach(
        ([id, player]) => {

            const chip =
                document.createElement(
                    "div"
                );

            chip.className =
                "player-chip";


            if (id === playerId) {

                chip.classList.add(
                    "me"
                );

                chip.textContent =
                    "● " +
                    player.name +
                    " (VOCÊ)";

            } else {

                chip.textContent =
                    "● " +
                    player.name;

            }


            playersList.appendChild(
                chip
            );

        }
    );

}


/* ========================================
   CRIAR PERSONAGEM
======================================== */

function createPlayerElement(
    id,
    player
) {

    const element =
        document.createElement(
            "div"
        );

    element.className =
        "player";

    element.dataset.id =
        id;

    element.dataset.direction =
        player.direction ||
        "down";


    const name =
        document.createElement(
            "div"
        );

    name.className =
        "player-name";

    name.textContent =
        player.name ||
        "Jogador";


    const head =
        document.createElement(
            "div"
        );

    head.className =
        "player-head";


    const cap =
        document.createElement(
            "div"
        );

    cap.className =
        "player-cap";


    const body =
        document.createElement(
            "div"
        );

    body.className =
        "player-body";


    element.appendChild(
        name
    );

    element.appendChild(
        body
    );

    element.appendChild(
        head
    );

    element.appendChild(
        cap
    );


    return element;

}


/* ========================================
   MENSAGEM
======================================== */

function showMessage(
    text,
    type = ""
) {

    message.textContent =
        text;

    message.className =
        "message " + type;

}


/* ========================================
   BOTÃO ENTRAR
======================================== */

enterButton.addEventListener(
    "click",
    enterOnline
);


playerNameInput.addEventListener(
    "keydown",
