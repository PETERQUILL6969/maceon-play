<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Maceon Online</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            background: #10131a;
            color: white;

            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            text-align: center;
            padding: 30px;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 36px;
        }

        .status {
            margin-top: 25px;
            padding: 15px 25px;

            border-radius: 12px;

            background: #1b2130;
            border: 1px solid #333c50;
        }

        .online {
            color: #55e878;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>MACEON ONLINE</h1>

        <p>Novo projeto multiplayer</p>

        <div class="status">
            Status:
            <span class="online">● PROJETO FUNCIONANDO</span>
        </div>

    </div>

</body>
</html>
