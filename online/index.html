<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Maceon Online - FireRed</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: #080b10;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
        }

        #start-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .start-card {
            width: min(92vw, 520px);
            padding: 32px 24px;
            border-radius: 20px;
            border: 1px solid #30363d;
            background: #161b22;
            text-align: center;
        }

        .start-card h1 {
            margin: 0 0 8px;
            font-size: 32px;
            letter-spacing: 2px;
        }

        .start-card p {
            margin: 0 0 26px;
            color: #9ba7b4;
            line-height: 1.5;
        }

        #play-button {
            width: 100%;
            min-height: 58px;
            border: 0;
            border-radius: 12px;
            background: #238636;
            color: white;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
        }

        #play-button:active {
            transform: scale(0.98);
        }

        .test-note {
            margin-top: 18px;
            color: #8b949e;
            font-size: 13px;
        }

        #game-screen {
            display: none;
            width: 100%;
            min-height: 100vh;
            background: #000;
        }

        #game {
            width: 100%;
            height: 100vh;
            min-height: 520px;
            background: #000;
        }

        @media (max-width: 600px) {
            #start-screen {
                padding: 16px;
            }

            .start-card {
                padding: 26px 18px;
            }

            .start-card h1 {
                font-size: 27px;
            }

            #game {
                height: 100dvh;
                min-height: 100dvh;
            }
        }
    </style>
</head>

<body>

    <div id="start-screen">

        <div class="start-card">

            <h1>MACEON ONLINE</h1>

            <p>
                Teste de integração do Pokémon FireRed
                com o novo projeto online.
            </p>

            <button id="play-button">
                JOGAR FIRE RED
            </button>

            <div class="test-note">
                Etapa atual: verificar somente se o jogo abre corretamente.
            </div>

        </div>

    </div>


    <div id="game-screen">

        <div id="game"></div>

    </div>


    <script>
        /*
        =========================================
        MACEON ONLINE - TESTE DO FIRE RED
        =========================================

        ROM:
        /online/games/jogo.gba

        Nesta etapa NÃO estamos ativando
        o multiplayer ainda.
        =========================================
        */

        const GAME_URL = "./games/jogo.gba";

        let gameStarted = false;


        document
            .getElementById("play-button")
            .addEventListener("click", startGame);


        function startGame() {

            if (gameStarted) {
                return;
            }

            gameStarted = true;

            const startScreen =
                document.getElementById("start-screen");

            const gameScreen =
                document.getElementById("game-screen");


            startScreen.style.display = "none";
            gameScreen.style.display = "block";


            /*
            =====================================
            CONFIGURAÇÃO DO EMULATORJS
            =====================================
            */

            window.EJS_player = "#game";

            window.EJS_core = "gba";

            window.EJS_gameName =
                "Maceon Online - FireRed";

            window.EJS_gameUrl =
                GAME_URL;

            window.EJS_pathtodata =
                "https://cdn.emulatorjs.org/stable/data/";

            window.EJS_startOnLoaded =
                true;

            window.EJS_disableDatabases =
                false;

            window.EJS_threads =
                false;


            /*
            Carrega o EmulatorJS somente
            depois que o jogador toca em JOGAR.
            */

            const loader =
                document.createElement("script");

            loader.src =
                "https://cdn.emulatorjs.org/stable/data/loader.js";

            loader.async =
                true;


            loader.onerror =
                function () {

                    gameStarted = false;

                    gameScreen.style.display =
                        "none";

                    startScreen.style.display =
                        "flex";

                    alert(
                        "Não foi possível carregar o emulador."
                    );

                };


            document.body.appendChild(loader);

        }
    </script>

</body>
</html>
